    const c=rev.cards[rev.i]; const g=b.dataset.grade;
    srsGrade(c.id,g); rev.done++;
    if(g==='again'){ rev.again++; rev.cards.push(c); }
    rev.i++; rev.flipped=false; render();
  });
  const rr=$('#revRestart'); if(rr)rr.onclick=()=>{ rev.active=false; render(); };

  // quiz setup
  const sq=$('#startQuiz'); if(sq)sq.onclick=()=>{ quiz=buildQuiz($('#qScope').value,$('#qMode').value,parseInt($('#qLen').value,10)); render(); };
  $$('.opt[data-opt]').forEach(b=>b.onclick=()=>answerMC(parseInt(b.dataset.opt,10)));
  const nq=$('#nextQ'); if(nq)nq.onclick=nextQ;
  const ts=$('#typeSubmit'); if(ts)ts.onclick=submitType;
  const ti=$('#typeAns'); if(ti)ti.onkeydown=e=>{if(e.key==='Enter')submitType();};
  const mr=$('#markRight'); if(mr)mr.onclick=()=>gradeType(true);
  const mw=$('#markWrong'); if(mw)mw.onclick=()=>gradeType(false);
  const qa=$('#quizAgain'); if(qa)qa.onclick=()=>{ quiz=null; render(); };
  const rm=$('#retryMiss'); if(rm)rm.onclick=()=>{ const miss=quiz.items.filter(it=>it.missed).map(it=>state.terms.find(t=>t.id===it.id)).filter(Boolean); quiz=buildQuiz(quiz.scope,quiz.mode,0,miss); render(); };

  // compare
  const ds2=$('#drillStart'); if(ds2)ds2.onclick=()=>{ startDrill(parseInt($('#drillPair').value,10)); render(); };
  $$('[data-drill]').forEach(b=>b.onclick=()=>{
    if(drill.answered)return;
    drill.pick=b.dataset.drill; drill.answered=true;
    if(drill.pick===drill.items[drill.i].k) drill.score++;
    render();
  });
  const dn=$('#drillNext'); if(dn)dn.onclick=()=>{ if(drill.i+1<drill.items.length){drill.i++;drill.answered=false;drill.pick='';} else drill.done=true; render(); };
  const da=$('#drillAgain'); if(da)da.onclick=()=>{ startDrill(drill.pi); render(); };
  const dw=$('#drillNew'); if(dw)dw.onclick=()=>{ drill=null; render(); };
  const cs=$('#cmpSearch'); if(cs)cs.oninput=()=>renderCmpResults(cs.value);
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ cmp.ids=cmp.ids.filter(x=>x!==b.dataset.rm); render(); });
  $$('[data-add]').forEach(b=>b.onclick=()=>{ if(!cmp.ids.includes(b.dataset.add)&&cmp.ids.length<3)cmp.ids.push(b.dataset.add); render(); });

  // resources
  const ar=$('#addRes'); if(ar)ar.onclick=openResModal;
  $$('[data-resdel]').forEach(b=>b.onclick=()=>{ state.resources=state.resources.filter(r=>r.id!==b.dataset.resdel); Store.set('resources',state.resources); render(); toast('Removed'); });
}
function advanceDeck(){ if(deck.i+1<deck.cards.length){deck.i++;deck.flipped=false;render();} else {deck.cards=[];state.view='quiz';quiz=null;render();toast('Deck complete — quiz yourself?');} }

function answerMC(k){
  const q=quiz.items[quiz.i]; if(quiz.answered)return;
  quiz.answered=true; quiz.picked=k;
  const correct=q.options[k].correct;
  if(correct)quiz.score++; else q.missed=true;
  mark(q.id,correct); render();
}
function nextQ(){ if(quiz.i+1<quiz.items.length){quiz.i++;quiz.answered=false;quiz.picked=-1;quiz.typed='';render();} else {quiz.done=true;render();} }
function submitType(){
  const v=$('#typeAns').value.trim(); const q=quiz.items[quiz.i];
  quiz.typed=v; quiz.answered=true;
  const a=norm(v), b=norm(q.term);
  // accept exact, contained, or parenthetical alias
  const alias=(q.term.match(/\(([^)]+)\)/)||[])[1];
  const auto = a&&(a===b || (a.length>3&&(b.includes(a)||a.includes(b))) || (alias&&norm(alias)===a));
  if(auto){ quiz.score++; mark(q.id,true); }
  else { q.missed=true; mark(q.id,false); }
  quiz.autograded=auto; render();
}
function gradeType(right){
  const q=quiz.items[quiz.i];
  // adjust if user overrides autograde
  if(right&&q.missed){ q.missed=false; quiz.score++; mark(q.id,true); }
  else if(!right&&!q.missed){ q.missed=true; quiz.score=Math.max(0,quiz.score-1); mark(q.id,false); }
  nextQ();
}

function renderCmpResults(qstr){
  const box=$('#cmpResults'); if(!box)return;
  const q=qstr.trim().toLowerCase();
  if(!q){box.innerHTML='';return;}
  const hits=state.terms.filter(t=>!cmp.ids.includes(t.id)&&(t.term+' '+t.def).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=`<div class="terms" style="margin-bottom:18px">`+hits.map(t=>`<article class="term collapsed" style="cursor:pointer" data-pick="${esc(t.id)}"><div class="tline"><h3 style="font-size:16px">${esc(t.term)}</h3><span class="grouptag">${esc(t.group)}</span></div></article>`).join('')+`</div>`;
  $$('[data-pick]').forEach(b=>b.onclick=()=>{ if(cmp.ids.length<3)cmp.ids.push(b.dataset.pick); render(); });
}

/* tabs + search */
$$('#tabs button').forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; if(state.view==='study')deck.cards=[]; if(state.view==='quiz')quiz=null; render(); });
$('#globalSearch').addEventListener('input',e=>{ state.query=e.target.value; if(state.view!=='library'){state.view='library';} state.scope='all'; render(); $('#globalSearch').focus(); const v=e.target.value; const inp=$('#globalSearch'); inp.value=v; inp.setSelectionRange(v.length,v.length); });

init();
</script>
