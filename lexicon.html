  if(!deck.cards.length){ deck.cards=shuffle(scopeTerms(state.scope)); deck.i=0; deck.flipped=false; }
  const total=deck.cards.length;
  if(!total) return `<div class="quizwrap"><div class="card"><div class="scopebar"><label>Deck</label><select id="deckScope">${buildScopeOptions(state.scope)}</select></div><div class="empty"><div class="big">No cards</div>This group is empty.</div></div></div>`;
  const c=deck.cards[deck.i];
  const pct=Math.round(((deck.i)/total)*100);
  return `
  <div class="flashwrap">
    <div class="scopebar">
      <label>Deck</label>
      <select id="deckScope">${buildScopeOptions(state.scope)}</select>
      <button class="btn ghost sm" id="reshuffle">↻ Shuffle</button>
    </div>
    <div class="deckmeta">Card ${deck.i+1} of ${total}</div>
    <div class="progbar"><i style="width:${pct}%"></i></div>
    <div class="flash ${deck.flipped?'flip':''}" id="flash">
      <div class="flashinner">
        <div class="face front">
          <div class="lab">Term</div>
          <h2>${esc(c.term)}</h2>
          <div class="grouptag">${esc(c.category)} · ${esc(c.group)}</div>
          <div class="hint">Click to reveal definition</div>
        </div>
        <div class="face back">
          <div class="lab">Definition</div>
          <div class="bk-term">${esc(c.term)}</div>
          <div class="bk-def">${esc(c.def)}</div>
        </div>
      </div>
    </div>
    <div class="deckctrl">
      <button class="btn ghost sm" id="prevCard">← Prev</button>
      <div class="mid">
        <button class="btn ghost sm" id="reviewAgain" style="border-color:var(--warn);color:var(--warn)">Review again</button>
        <button class="btn sm" id="gotIt" style="background:var(--accent)">Knew it ✓</button>
      </div>
      <button class="btn ghost sm" id="nextCard">Next →</button>
    </div>
  </div>`;
}

/* ============================== view: quiz ============================== */
let quiz=null;
function viewQuiz(){
  if(!quiz){
    return `<div class="quizwrap"><div class="card">
      <div class="panelhead" style="margin-bottom:18px"><div><div class="eyebrow">Quiz</div><h2>Test yourself</h2><p>Pick a scope and format. Misses get flagged for review.</p></div></div>
      <div class="field"><label>Scope</label><select id="qScope">${buildScopeOptions(state.scope)}</select></div>
      <div class="row2">
        <div class="field"><label>Format</label><select id="qMode">
          <option value="mc-term">Multiple choice — name the term</option>
          <option value="mc-def">Multiple choice — pick the definition</option>
          <option value="type">Type the term</option>
        </select></div>
        <div class="field"><label>Length</label><select id="qLen">
          <option value="10">10 questions</option><option value="20">20 questions</option><option value="0">All</option>
        </select></div>
      </div>
      <button class="btn" id="startQuiz" style="width:100%;justify-content:center">Start quiz</button>
    </div></div>`;
  }
  if(quiz.done) return quizResults();
  const q=quiz.items[quiz.i];
  const head=`<div class="scoreline"><span>Question ${quiz.i+1} / ${quiz.items.length}</span><span>Score ${quiz.score}</span></div>
    <div class="progbar"><i style="width:${Math.round(quiz.i/quiz.items.length*100)}%"></i></div>`;

  if(quiz.mode==='type'){
    const answered=quiz.answered;
    return `<div class="quizwrap"><div class="card">${head}
      <div class="q-prompt">Name the term</div>
      <div class="q-body">${esc(q.def)}</div>
      <div class="typed"><input id="typeAns" placeholder="Type the term…" ${answered?'disabled':''} value="${answered?esc(quiz.typed||''):''}"><button class="btn" id="typeSubmit" ${answered?'disabled':''}>Check</button></div>
      ${answered?`<div class="reveal"><div class="r-term">${esc(q.term)}</div><div class="r-def">${esc(q.def)}</div>
        <div class="grade"><button class="btn ghost sm" id="markWrong" style="border-color:var(--warn);color:var(--warn)">I got it wrong</button><button class="btn sm" id="markRight" style="background:var(--accent)">I was right</button></div></div>`:''}
    </div></div>`;
  }

  // multiple choice
  const showDef = quiz.mode==='mc-term';
  const prompt = showDef? 'Which term matches this definition?' : 'Which definition matches this term?';
  const body = showDef? `<div class="q-body">${esc(q.def)}</div>` : `<div class="q-body term">${esc(q.term)}</div>`;
  const opts=q.options.map((o,k)=>{
    let cls='opt';
    if(quiz.answered){ if(o.correct) cls+=' correct'; else if(k===quiz.picked) cls+=' wrong'; }
    const label = showDef? o.term : o.def;
    return `<button class="${cls}" data-opt="${k}" ${quiz.answered?'disabled':''}>${esc(label)}</button>`;
  }).join('');
  return `<div class="quizwrap"><div class="card">${head}
    <div class="q-prompt">${prompt}</div>${body}
    <div class="opts">${opts}</div>
    ${quiz.answered?`<button class="btn" id="nextQ" style="width:100%;justify-content:center;margin-top:18px">${quiz.i+1<quiz.items.length?'Next question →':'See results'}</button>`:''}
  </div></div>`;
}
function quizResults(){
  const pct=Math.round(quiz.score/quiz.items.length*100);
  const miss=quiz.items.filter(it=>it.missed);
  let ml='';
  if(miss.length){ ml=`<div class="misslist"><h4>Review these (${miss.length})</h4>`+miss.map(it=>`<div class="missitem"><b>${esc(it.term)}</b><div style="font-size:13px;color:var(--muted);margin-top:4px">${esc(it.def)}</div></div>`).join('')+`</div>`; }
  return `<div class="quizwrap"><div class="card results">
    <div class="score">${pct}%</div>
    <div class="sub">${quiz.score} of ${quiz.items.length} correct</div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:center">
      ${miss.length?`<button class="btn" id="retryMiss" style="background:var(--warn)">Retry missed (${miss.length})</button>`:''}
      <button class="btn ghost" id="quizAgain">New quiz</button>
    </div>
    ${ml}
  </div></div>`;
}
function buildQuiz(scope,mode,len,pool){
  let terms = pool || scopeTerms(scope);
  terms = shuffle(terms);
  if(len>0) terms=terms.slice(0,len);
  const all=state.terms;
  const items=terms.map(t=>{
    const item={id:t.id,term:t.term,def:t.def,missed:false};
    if(mode!=='type'){
      const distract=shuffle(all.filter(x=>x.id!==t.id && x.category===t.category));
      let pool3=distract.slice(0,3);
      if(pool3.length<3) pool3=pool3.concat(shuffle(all.filter(x=>x.id!==t.id)).slice(0,3-pool3.length));
      item.options=shuffle([{term:t.term,def:t.def,correct:true},...pool3.map(d=>({term:d.term,def:d.def,correct:false}))]);
    }
    return item;
  });
  return {scope,mode,len,items,i:0,score:0,answered:false,picked:-1,typed:'',done:false};
}

/* ============================== view: compare ============================== */
let cmp={ids:[]};
function viewCompare(){
  const chips=cmp.ids.map(id=>{const t=state.terms.find(x=>x.id===id);return t?`<span class="chip">${esc(t.term)}<button data-rm="${esc(id)}">×</button></span>`:'';}).join('');
  let grid='';
  if(cmp.ids.length){
    grid=`<div class="cmp-grid">`+cmp.ids.map(id=>{
      const t=state.terms.find(x=>x.id===id); if(!t)return'';
      return `<div class="cmp-col card"><div class="grouptag">${esc(t.category)} · ${esc(t.group)}</div><h3>${esc(t.term)}</h3><div class="def">${esc(t.def)}</div></div>`;
    }).join('')+`</div>`;
    // related: same group, not already picked
    const base=state.terms.find(x=>x.id===cmp.ids[cmp.ids.length-1]);
    if(base){
      const rel=state.terms.filter(t=>t.group===base.group&&!cmp.ids.includes(t.id)).slice(0,8);
      if(rel.length) grid+=`<div class="related"><h4>Related in ${esc(base.group)}</h4>`+rel.map(t=>`<button class="r" data-add="${esc(t.id)}">${esc(t.term)}</button>`).join('')+`</div>`;
    }
  } else {
    grid=`<div class="empty"><div class="big">Compare two definitions side by side</div>Search and pick terms below — useful for sister concepts like American vs. European waterfall, or DPI vs. TVPI.</div>`;
  }
  return `<div>
    <div class="panelhead"><div><div class="eyebrow">Compare</div><h2>Side by side</h2><p>Add 2–3 terms to see their definitions together and surface related concepts.</p></div></div>
    <div class="cmp-pick">${chips}
      <div class="search" style="flex:1 1 220px;max-width:340px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="cmpSearch" placeholder="Add a term…" autocomplete="off"></div>
    </div>
    <div id="cmpResults"></div>
    ${grid}
  </div>`;
}

/* ============================== view: resources ============================== */
function viewResources(){
  let list=state.resources.map(r=>{
    const host=(()=>{try{return new URL(r.url).hostname.replace('www.','')}catch(e){return''}})();
    return `<div class="resitem" data-id="${esc(r.id)}">
      <div style="min-width:0">
        <h3>${r.url?`<a class="tt" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</h3>
        ${r.url?`<div class="src">${esc(host||r.url)}</div>`:''}
        ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto">
        ${r.cat?`<span class="tag">${esc(r.cat)}</span>`:''}
        <button class="btn ghost sm" data-resdel="${esc(r.id)}"><span class="danger">Remove</span></button>
      </div>
    </div>`;
  }).join('');
  if(!state.resources.length) list=`<div class="empty"><div class="big">No saved resources yet</div>Save articles, primers, and explainers you want to come back to. Add a title, a link, and a note on why it mattered.</div>`;
  return `<div>
    <div class="panelhead">
      <div><div class="eyebrow">Resources</div><h2>Reading shelf</h2><p>The articles and explainers worth returning to — tagged and searchable alongside your terms.</p></div>
      <button class="btn sm" id="addRes">+ Add resource</button>
    </div>
    <div class="res">${list}</div>
  </div>`;
}

/* ============================== modals ============================== */
function openTermModal(id){
  const t=id?state.terms.find(x=>x.id===id):null;
  const cats=categories();
  const catOpts=cats.map(c=>`<option ${t&&t.category===c?'selected':''}>${esc(c)}</option>`).join('')+`<option value="__new">+ New category…</option>`;
  const curCat=t?t.category:cats[0];
  const grpOpts=groupsFor(curCat).map(g=>`<option ${t&&t.group===g?'selected':''}>${esc(g)}</option>`).join('')+`<option value="__new">+ New group…</option>`;
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal">
    <h3>${t?'Edit term':'Add a term'}</h3>
    <div class="field"><label>Term</label><input id="fTerm" value="${t?esc(t.term):''}" placeholder="e.g. Carried interest"></div>
    <div class="field"><label>Definition</label><textarea id="fDef" placeholder="Go deep — why it exists, how it works, why professionals care.">${t?esc(t.def):''}</textarea></div>
    <div class="row2">
      <div class="field"><label>Category</label><select id="fCat">${catOpts}</select><input id="fCatNew" placeholder="New category" style="display:none;margin-top:8px"></div>
      <div class="field"><label>Group</label><select id="fGrp">${grpOpts}</select><input id="fGrpNew" placeholder="New group" style="display:none;margin-top:8px"></div>
    </div>
    <div class="modalacts">
      <button class="btn ghost" id="cancelModal">Cancel</button>
      <button class="btn" id="saveTermBtn">${t?'Save changes':'Add term'}</button>
    </div>
  </div></div>`;
  const fCat=$('#fCat'),fGrp=$('#fGrp');
  fCat.value=curCat;
  const refreshGroups=()=>{ const c=fCat.value==='__new'?'':fCat.value; const gs=c?groupsFor(c):[]; fGrp.innerHTML=gs.map(g=>`<option>${esc(g)}</option>`).join('')+`<option value="__new">+ New group…</option>`; toggleNew(); };
  const toggleNew=()=>{ $('#fCatNew').style.display=fCat.value==='__new'?'block':'none'; $('#fGrpNew').style.display=fGrp.value==='__new'?'block':'none'; };
  fCat.onchange=refreshGroups; fGrp.onchange=toggleNew; toggleNew();
  $('#cancelModal').onclick=closeModal; $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeModal();};
  $('#saveTermBtn').onclick=()=>{
    const term=$('#fTerm').value.trim(); const def=$('#fDef').value.trim();
    if(!term||!def){ toast('Term and definition required'); return; }
    let cat=fCat.value==='__new'?$('#fCatNew').value.trim():fCat.value;
    let grp=fGrp.value==='__new'?$('#fGrpNew').value.trim():fGrp.value;
    if(!cat)cat='Uncategorized'; if(!grp)grp='General';
    if(t){ Object.assign(t,{term,def,category:cat,group:grp}); toast('Updated'); }
    else { const nid=slug(term)+'-'+Math.random().toString(36).slice(2,5); state.terms.push({id:nid,term,def,category:cat,group:grp}); toast('Added'); }
    Store.set('terms',state.terms); closeModal(); deck.cards=[]; render();
  };
}
function openResModal(){
  const cats=categories();
  $('#modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal">
    <h3>Add a resource</h3>
    <div class="field"><label>Title</label><input id="rTitle" placeholder="Article or primer title"></div>
    <div class="field"><label>Link (optional)</label><input id="rUrl" placeholder="https://…"></div>
    <div class="field"><label>Why it matters (optional)</label><textarea id="rNote" placeholder="A line on what it taught you or why you saved it."></textarea></div>
    <div class="field"><label>Tag (optional)</label><select id="rCat"><option value="">None</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="modalacts"><button class="btn ghost" id="cancelModal">Cancel</button><button class="btn" id="saveResBtn">Add resource</button></div>
  </div></div>`;
  $('#cancelModal').onclick=closeModal; $('#scrim').onclick=e=>{if(e.target.id==='scrim')closeModal();};
  $('#saveResBtn').onclick=()=>{
    const title=$('#rTitle').value.trim(); if(!title){toast('Title required');return;}
    let url=$('#rUrl').value.trim(); if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
    state.resources.unshift({id:uid(),title,url,note:$('#rNote').value.trim(),cat:$('#rCat').value});
    Store.set('resources',state.resources); toast('Saved'); closeModal(); render();
  };
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* ============================== wiring ============================== */
function wire(){
  // library
  $$('[data-scope]').forEach(b=>b.onclick=()=>{ state.scope=b.dataset.scope; state.query=''; $('#globalSearch').value=''; render(); });
  const mt=$('#menuToggle'); if(mt)mt.onclick=()=>$('#indexPanel').classList.toggle('show');
  const at=$('#addTerm'); if(at)at.onclick=()=>openTermModal();
  $$('.term').forEach(card=>{
    card.onclick=e=>{ if(e.target.closest('[data-act]'))return; card.classList.toggle('open'); card.classList.toggle('collapsed'); };
  });
  $$('[data-act]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const id=b.dataset.id;
    if(b.dataset.act==='edit')openTermModal(id);
    else if(b.dataset.act==='del'){ if(confirm('Delete this term?')){ state.terms=state.terms.filter(t=>t.id!==id); Store.set('terms',state.terms); deck.cards=[]; render(); toast('Deleted'); } }
  });

  // study
  const ds=$('#deckScope'); if(ds)ds.onchange=()=>{ state.scope=ds.value; deck.cards=shuffle(scopeTerms(ds.value)); deck.i=0; deck.flipped=false; render(); };
  const rs=$('#reshuffle'); if(rs)rs.onclick=()=>{ deck.cards=shuffle(deck.cards); deck.i=0; deck.flipped=false; render(); };
  const fl=$('#flash'); if(fl)fl.onclick=()=>{ deck.flipped=!deck.flipped; fl.classList.toggle('flip'); };
  const nc=$('#nextCard'); if(nc)nc.onclick=()=>{ deck.i=(deck.i+1)%deck.cards.length; deck.flipped=false; render(); };
  const pc=$('#prevCard'); if(pc)pc.onclick=()=>{ deck.i=(deck.i-1+deck.cards.length)%deck.cards.length; deck.flipped=false; render(); };
  const gi=$('#gotIt'); if(gi)gi.onclick=()=>{ mark(deck.cards[deck.i].id,true); advanceDeck(); };
  const ra=$('#reviewAgain'); if(ra)ra.onclick=()=>{ mark(deck.cards[deck.i].id,false); advanceDeck(); };

  // quiz setup
  const sq=$('#startQuiz'); if(sq)sq.onclick=()=>{ quiz=buildQuiz($('#qScope').value,$('#qMode').value,parseInt($('#qLen').value,10)); render(); };
  $$('.opt[data-opt]').forEach(b=>b.onclick=()=>answerMC(parseInt(b.dataset.opt,10)));
  const nq=$('#nextQ'); if(nq)nq.onclick=nextQ;
  const ts=$('#typeSubmit'); if(ts)ts.onclick=submitType;
  const ti=$('#typeAns'); if(ti)ti.onkeydown=e=>{if(e.key==='Enter')submitType();};
  const mr=$('#markRight'); if(mr)mr.onclick=()=>gradeType(true);
  const mw=$('#markWrong'); if(mw)mw.onclick=()=>gradeType(false);
  const qa=$('#quizAgain'); if(qa)qa.onclick=()=>{ quiz=null; render(); };
  const rm=$('#retryMiss'); if(rm)rm.onclick=()=>{ const miss=quiz.items.filter(it=>it.missed).map(it=>state.terms.find(t=>t.id===it.id)).filter(Boolean); quiz=buildQuiz(quiz.scope,quiz.mode,0,miss); render(); };

  // compare
  const cs=$('#cmpSearch'); if(cs)cs.oninput=()=>renderCmpResults(cs.value);
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ cmp.ids=cmp.ids.filter(x=>x!==b.dataset.rm); render(); });
  $$('[data-add]').forEach(b=>b.onclick=()=>{ if(!cmp.ids.includes(b.dataset.add)&&cmp.ids.length<3)cmp.ids.push(b.dataset.add); render(); });

  // resources
  const ar=$('#addRes'); if(ar)ar.onclick=openResModal;
  $$('[data-resdel]').forEach(b=>b.onclick=()=>{ state.resources=state.resources.filter(r=>r.id!==b.dataset.resdel); Store.set('resources',state.resources); render(); toast('Removed'); });
}
function advanceDeck(){ if(deck.i+1<deck.cards.length){deck.i++;deck.flipped=false;render();} else {deck.cards=[];state.view='quiz';quiz=null;render();toast('Deck complete — quiz yourself?');} }

function answerMC(k){
  const q=quiz.items[quiz.i]; if(quiz.answered)return;
  quiz.answered=true; quiz.picked=k;
  const correct=q.options[k].correct;
  if(correct)quiz.score++; else q.missed=true;
  mark(q.id,correct); render();
}
function nextQ(){ if(quiz.i+1<quiz.items.length){quiz.i++;quiz.answered=false;quiz.picked=-1;quiz.typed='';render();} else {quiz.done=true;render();} }
function submitType(){
  const v=$('#typeAns').value.trim(); const q=quiz.items[quiz.i];
  quiz.typed=v; quiz.answered=true;
  const a=norm(v), b=norm(q.term);
  // accept exact, contained, or parenthetical alias
  const alias=(q.term.match(/\(([^)]+)\)/)||[])[1];
  const auto = a&&(a===b || (a.length>3&&(b.includes(a)||a.includes(b))) || (alias&&norm(alias)===a));
  if(auto){ quiz.score++; mark(q.id,true); }
  else { q.missed=true; mark(q.id,false); }
  quiz.autograded=auto; render();
}
function gradeType(right){
  const q=quiz.items[quiz.i];
  // adjust if user overrides autograde
  if(right&&q.missed){ q.missed=false; quiz.score++; mark(q.id,true); }
  else if(!right&&!q.missed){ q.missed=true; quiz.score=Math.max(0,quiz.score-1); mark(q.id,false); }
  nextQ();
}

function renderCmpResults(qstr){
  const box=$('#cmpResults'); if(!box)return;
  const q=qstr.trim().toLowerCase();
  if(!q){box.innerHTML='';return;}
  const hits=state.terms.filter(t=>!cmp.ids.includes(t.id)&&(t.term+' '+t.def).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=`<div class="terms" style="margin-bottom:18px">`+hits.map(t=>`<article class="term collapsed" style="cursor:pointer" data-pick="${esc(t.id)}"><div class="tline"><h3 style="font-size:16px">${esc(t.term)}</h3><span class="grouptag">${esc(t.group)}</span></div></article>`).join('')+`</div>`;
  $$('[data-pick]').forEach(b=>b.onclick=()=>{ if(cmp.ids.length<3)cmp.ids.push(b.dataset.pick); render(); });
}

/* tabs + search */
$$('#tabs button').forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; if(state.view==='study')deck.cards=[]; if(state.view==='quiz')quiz=null; render(); });
$('#globalSearch').addEventListener('input',e=>{ state.query=e.target.value; if(state.view!=='library'){state.view='library';} state.scope='all'; render(); $('#globalSearch').focus(); const v=e.target.value; const inp=$('#globalSearch'); inp.value=v; inp.setSelectionRange(v.length,v.length); });

init();
</script>
