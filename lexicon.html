{t:'Adverse selection',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`When one side's hidden information poisons the pool of willing traders`,d:`When hidden information skews who shows up to trade: the people most eager to buy insurance are the sick; the used cars most eagerly sold are the lemons. Akerlof's Nobel-winning insight was that unchecked, this unravels markets entirely — good risks exit as prices rise to cover bad ones. In markets, it's why being the uninformed side of any trade is expensive: ask who's selling, and why they're selling to you.`},
{t:'Principal-agent problem',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`When the person acting on your behalf has different incentives than you`,d:`The misalignment between those who own (principals) and those who act on their behalf (agents) — shareholders and CEOs, LPs and GPs, clients and brokers. Agents optimize for their own compensation, tenure, and reputation, which only partially overlaps with owners' outcomes. Vast machinery exists to patch it (equity comp, carry, covenants, boards), and reading any fee structure is really an exercise in diagnosing it.`},
{t:'Externality',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Costs or benefits imposed on parties outside the transaction`,d:`A cost or benefit falling on someone outside the transaction — pollution as the classic negative, vaccination as the positive. Markets overproduce the first and underproduce the second because prices don't capture them; this is the textbook justification for taxes, subsidies, and regulation ("internalizing" the effect). Carbon pricing is the largest-scale attempt in history to force one back into market prices.`},
{t:'Nash equilibrium',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`A stable outcome where no player gains by unilaterally deviating`,d:`Game theory's core solution concept: a set of strategies where no player benefits from changing course alone, given what everyone else is doing. It explains stuck outcomes that no one prefers — price wars, arms races, oligopolies tacitly holding prices high without ever colluding. For analyzing industries it's indispensable: competitive dynamics are games, and equilibrium tells you where they settle.`},
{t:'Creative destruction',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Innovation destroying incumbents as the engine of capitalist growth`,d:`Schumpeter's description of capitalism's essential process: innovation continuously destroys existing industries, firms, and jobs while creating new ones — the destruction not a bug but the mechanism of progress. It's the deep argument against protecting incumbents, and the investor's memento mori: most moats erode, disruption is the base rate, and today's compounder is tomorrow's case study unless it disrupts itself first.`},
{t:'Rent-seeking',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Extracting wealth through lobbying and barriers rather than creating it`,d:`Pursuing wealth by capturing existing value rather than creating new value — lobbying for tariffs, licensing barriers, subsidies, or regulation that hobbles competitors. It's privately rational and socially corrosive: resources flow to influencing rules instead of building things. The investor's ambivalence is real — regulatory moats built this way protect margins beautifully, right up until the political weather changes.`},
{t:'Incentives',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`The rewards and penalties that predict behavior better than stated intentions`,d:`The organizing principle beneath all of economics: people respond to rewards and penalties, reliably and often perversely. Munger's razor — "show me the incentive and I will show you the outcome" — is arguably the single most useful analytical tool in finance. Reading any structure (fee agreements, comp plans, regulations, org charts) starts with asking who gets paid, for what, and what behavior that actually purchases.`},

/* ---------- Behavioral Finance & Psychology (Economics) ---------- */
{t:'Loss aversion',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`The pain of a decline outweighs the pleasure of an equal gain, two to one`,d:`Kahneman and Tversky's finding that losses hurt roughly twice as much as equivalent gains satisfy — the emotional asymmetry at the heart of prospect theory. It drives panic selling at bottoms, refusal to realize losing positions, and the demand for downside protection at almost any price. Understanding it in others is edge; failing to recognize it in yourself is how the edge gets spent.`},
{t:'Anchoring',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Irrelevant reference numbers dragging estimates toward themselves`,d:`The pull of an initial reference number on subsequent judgment, even when the anchor is arbitrary. In markets it's everywhere: your purchase price feels like the stock's "real" value, 52-week highs feel like targets, last year's price feels like this year's floor. The asset doesn't know what you paid — but investors trade as if it does, and that systematic error is tradable.`},
{t:'Herding',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Following the crowd into trades because everyone else already did`,d:`Following the crowd into positions because others' behavior feels like information — rational for individuals (especially career-conscious professionals, for whom failing conventionally beats failing alone) and destabilizing in aggregate. It's the engine of bubbles and crashes alike. Keynes saw it a century ago: professional investing becomes a beauty contest of anticipating what average opinion expects average opinion to be.`},
{t:'Overconfidence',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Systematically overrating your own knowledge, precision, and skill`,d:`The most robust bias in the literature: people systematically overrate their knowledge, the precision of their forecasts, and their standing relative to others. In markets it manifests as overtrading (which reliably destroys returns), concentrated conviction in unvetted theses, and confusing bull-market gains with skill. The uncomfortable structural truth: the same trait fuels both entrepreneurial success and investment ruin.`},
{t:'Confirmation bias',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Seeking evidence that agrees with you and dismissing what doesn't`,d:`The tendency to seek, notice, and weight evidence that supports existing beliefs while dismissing contradiction. For investors it's the thesis-creep machine: once positioned, every data point reads as vindication. The professional countermeasures are structural, not willpower — pre-mortems, red teams, explicitly written kill criteria, and the discipline of articulating the strongest version of the opposite case.`},
{t:'Recency bias',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Overweighting the latest experience when judging what comes next`,d:`Overweighting recent experience when forecasting — extrapolating the latest regime as permanent. After crashes, everyone hedges tail risk; after long bulls, drawdowns feel theoretical; after a decade of ZIRP, an entire cohort of investors had never priced a rate hike. It's why the cycle's turning points blindside majorities, and why studying market history is a competitive advantage disguised as trivia.`},
{t:'Sunk cost fallacy',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Letting unrecoverable past spending dictate future decisions`,d:`Continuing an endeavor because of what's already been irrecoverably invested — money, time, reputation — rather than its forward-looking merits. Economically, sunk costs are irrelevant to every decision; psychologically, they dominate. The clean investing test: would you buy this position today at this price with fresh capital? If no, the only thing holding it is the history, and the market doesn't pay for your history.`},
{t:'Disposition effect',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Selling winners too early while clinging to losers`,d:`The documented pattern of investors selling winners too early (locking in the pleasure of a realized gain) while riding losers down (avoiding the pain of admitting a mistake). It's loss aversion operationalized in brokerage data — and it inverts the correct discipline, which cuts what's broken and lets what's working compound. Tax logic makes it worse: the behavior realizes gains and defers losses, the exact opposite of optimal.`},
{t:'Reflexivity',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Prices changing the fundamentals they're supposed to reflect`,d:`Soros's framework: prices don't just reflect fundamentals — they alter them. A rising stock lets a company raise cheap capital, attract talent, and acquire rivals, partially validating the optimism that lifted it; falling credit prices trigger the defaults they predicted. The feedback loop breaks the efficient-market assumption of one-way causality, and explains why booms and busts overshoot anything fundamentals alone would justify.`},
{t:'Narrative economics',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`Contagious stories driving markets as much as numbers do`,d:`Shiller's argument that economic events are driven substantially by contagious stories — narratives that spread like epidemics and move spending, investment, and prices regardless of their truth content. "Housing never falls," "AI changes everything," "this time is different." For investors the discipline is dual: track the narrative because it moves prices, and audit which of your own beliefs are analysis versus absorbed story.`},
{t:'FOMO & capitulation',c:'Economics',g:'Economic Principles & Behavior',sg:'Behavioral Finance & Psychology',q:`The emotional extremes marking market tops and bottoms`,d:`The bookend emotions of a market cycle: the fear of missing out that drags the last skeptics in near the top, and the exhausted surrender-selling that marks bottoms — when holders stop asking "is this cheap" and start asking "make it stop." Sentiment surveys, fund flows, and positioning data exist to measure both. The contrarian's creed is Buffett's: be fearful when others are greedy, greedy when others are fearful.`},


/* ---------- Returns on capital & quality (technical) ---------- */
{t:'ROIC (Return on Invested Capital)',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`After-tax operating profit relative to the money tied up in the business`,d:`NOPAT divided by invested capital — how much after-tax operating profit the business generates per dollar of capital deployed in it. The single best summary statistic of business quality: sustained returns above the cost of capital mean the company creates value as it grows; below it, growth actively destroys value. The buy-side obsession is durability — high returns attract competition, so the question is always what protects them.`},
{t:'ROE (Return on Equity)',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Net income relative to shareholders' book capital; flattered by leverage`,d:`Net income divided by shareholders' equity — profit per dollar of owners' capital. Buffett's favorite screen historically, but it carries a trap: leverage inflates it mechanically, since debt shrinks the equity denominator. A 20% figure from an unlevered business and the same figure from a heavily borrowed one are entirely different animals — which is exactly what the DuPont decomposition exists to untangle.`},
{t:'ROA (Return on Assets)',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Profit generated per dollar of total assets, ignoring financing mix`,d:`Net income divided by total assets — profitability per dollar of everything the company controls, regardless of how it's financed. Its virtue is immunity to leverage games; its main use is comparing asset-heavy businesses (banks especially, where a figure above 1% is respectable) and spotting when a rising ROE is really just rising debt rather than improving operations.`},
{t:'DuPont decomposition',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Splitting equity returns into margin, asset turnover, and leverage`,d:`Breaking ROE into three multiplicative drivers: profit margin (how much you keep per sale), asset turnover (how hard assets work), and financial leverage (how much debt magnifies it). Two companies with identical ROEs can have opposite models — a luxury house runs fat margins and slow turnover; a discount grocer the reverse. The decomposition tells you where the return comes from, and therefore how fragile it is.`},
{t:'NOPAT',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Operating profit taxed as if the company had no debt`,d:`Net Operating Profit After Tax — operating income with taxes applied as if the company carried no debt. It isolates the operating engine from financing decisions, which is exactly why it's the numerator in ROIC and the cash-flow starting point in most DCF builds. The adjustment matters: comparing companies on net income mixes their capital structures into the comparison; this strips them back out.`},
{t:'Invested capital',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`The total funding actually deployed in operating the business`,d:`The sum of capital actually tied up in running the business — typically net working capital plus fixed assets, or equivalently all equity and debt financing net of excess cash. It's the denominator in ROIC and the base against which value creation is judged. The analytical care goes into what to include: excess cash, goodwill from past deals, and leases all change the answer, and therefore the story.`},
{t:'Capital intensity',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`How much investment each dollar of revenue requires`,d:`How much capital a business must deploy to generate each dollar of revenue — measured roughly as capex plus working capital needs relative to sales. Railroads and semiconductor fabs sit at one extreme, software and franchising at the other. It's the structural reason software multiples dwarf industrial ones: low intensity means growth converts to free cash flow instead of being consumed by the growth itself.`},
{t:'Unit economics',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`The profitability of one customer, order, or transaction at a time`,d:`The profitability of a single unit of the business — one customer, ride, order, or subscription — before fixed costs. The discipline that separates real businesses from subsidized growth: if each transaction loses money, scale multiplies the losses ("we lose money on every sale but make it up in volume" is the joke). LTV/CAC, contribution margin per order, and payback period are its working vocabulary.`},
{t:'Contribution margin',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Revenue minus variable costs; what each sale adds toward fixed costs`,d:`Revenue minus variable costs — what each incremental sale contributes toward covering fixed costs and, past breakeven, toward profit. It's the bridge between unit economics and operating leverage: a high figure means volume growth drops almost straight to the bottom line once fixed costs are covered. Airlines, hotels, and software all live and die by it, in very different ways.`},
{t:'Incremental margin',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`The profitability of the next dollar of revenue, not the average one`,d:`The margin earned on the next dollar of revenue rather than the average of all revenue — new profit divided by new sales over a period. It's where operating leverage becomes visible in the numbers: a company with 20% average margins posting 40% on growth is scaling beautifully; one posting 5% is buying growth expensively. Sophisticated analysts model these, not averages, because stocks trade on the trajectory.`},

/* ---------- Valuation machinery (technical) ---------- */
{t:'CAPM',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`The model pricing expected return as risk-free plus beta times the premium`,d:`The Capital Asset Pricing Model: expected return equals the risk-free rate plus beta times the equity risk premium. It's the standard machinery for estimating cost of equity in a DCF, built on the idea that only systematic risk earns compensation. Empirically shaky — beta predicts returns poorly — but institutionally entrenched: it remains the shared language for discount rates precisely because everyone agrees to use it.`},
{t:'Equity risk premium',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`The extra return stocks must offer over safe government bonds`,d:`The extra expected return investors demand for holding stocks over risk-free government bonds — historically 4-6% in the U.S., though the forward-looking number is perpetually debated. It's the gravitational input in every cost-of-equity calculation and the hidden variable in "are stocks expensive" arguments: high valuations are rational if the premium has genuinely fallen, catastrophic if it hasn't.`},
{t:'Cost of equity',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`The return shareholders require for bearing a company's risk`,d:`The return a company's shareholders require to compensate for its risk — usually estimated via CAPM, typically landing between 8% and 12% for large companies. It's the discount rate for equity cash flows, the hurdle behind "does this create value," and the expensive half of WACC. Unlike the cost of debt, it appears on no invoice — which is why managements chronically treat equity as free money when it's the priciest capital they have.`},
{t:'FCF yield',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Cash generation relative to price; a multiple flipped into a return`,d:`Free cash flow divided by market capitalization (or enterprise value) — the valuation multiple inverted into a return you can compare against bonds, cash, and other stocks. A company at a 6% figure while Treasuries pay 4% is offering a 2% spread plus growth. Value investors favor it over P/E because cash is harder to manufacture than earnings, and it forces the capex conversation P/E lets you skip.`},
{t:'Exit multiple vs. perpetuity growth',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`The two rival methods for estimating terminal value in a DCF`,d:`The two ways to estimate a DCF's terminal value: apply a market multiple to the final year's earnings, or grow the final cash flow forever at a modest rate (Gordon growth). Each smuggles in different assumptions — the first imports today's market sentiment into your "intrinsic" value; the second is hypersensitive to the spread between the discount rate and the growth assumption. Rigorous practice runs both and confronts the gap.`},
{t:'Sensitivity analysis',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Stress-testing a model by flexing its key assumptions`,d:`Systematically varying a model's key inputs — discount rate, growth, margins — to see how the output moves, classically presented as a two-variable data table. Its honest purpose is epistemic: a DCF spitting out $47.23 is false precision, and the table reveals whether your thesis survives being modestly wrong. The professional tell: knowing which two assumptions your valuation actually hinges on, because most of the others barely matter.`},
{t:'Football field chart',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`The banker's exhibit stacking ranges from every methodology`,d:`The standard banker's exhibit stacking valuation ranges from every methodology — trading comps, precedent transactions, DCF, LBO capacity — as horizontal bars on one page. Where the bars overlap is the defensible range; where the client's price expectation sits relative to them is the entire negotiation. Reading one critically means asking which bars were stretched, and which methodology conveniently anchors the desired answer.`},
{t:'Normalized earnings',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`What a business makes mid-cycle, stripped of temporary distortions`,d:`An estimate of what a business earns across a full cycle, stripped of temporary distortions — commodity price spikes, pandemic surges, one-time charges, unsustainable margins. Valuing cyclicals on peak earnings at peak multiples is the classic way to buy the top; the discipline is asking what the business earns in an ordinary year. The inverse trap exists too: trough earnings make great businesses look expensive exactly when they're cheap.`},
{t:'EV/EBIT',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`An enterprise multiple that, unlike its cousin, respects depreciation`,d:`Enterprise value divided by operating income — the stricter sibling of EV/EBITDA, because it charges the company for depreciation and thus for the real cost of maintaining its assets. For capital-intensive businesses the two multiples tell wildly different stories, and this is the honest one. Joel Greenblatt's Magic Formula uses it for exactly this reason: it's the multiple that's hardest to flatter.`},
{t:'Owner earnings',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Buffett's measure: reported profit adjusted to true distributable cash`,d:`Buffett's 1986 formulation of what a business truly generates for its owners: reported profits plus depreciation and other non-cash charges, minus the capex actually required to maintain competitive position. It predates and roughly anticipates free cash flow, with one sharpening: the capex that counts is maintenance capex, a judgment call no filing hands you. The concept forces the question accounting avoids — how much cash could you extract forever without hurting the business?`},

/* ---------- Accounting additions (technical) ---------- */
{t:'EPS: basic vs. diluted',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Profit per share counted two ways: shares today versus all potential shares`,d:`Profit per share under two share counts: shares actually outstanding, versus the count if all options, RSUs, warrants, and convertibles turned into stock. The gap between them measures how much of the company has been quietly promised away. Serious analysis uses the second — and watches the share count's trajectory over years, since persistent creep silently confiscates growth from existing holders.`},
{t:'Stock-based compensation (SBC)',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Paying employees in equity; a real cost companies love to add back`,d:`Paying employees in options and restricted stock — a non-cash expense under GAAP, and the largest, most contested line in tech's non-GAAP adjustments. The add-back logic ("no cash left the building") is half true and wholly misleading: shareholders pay through dilution instead. The clean test is to look at share count growth or the cash spent on buybacks merely to offset it. It's pay; the currency is just your ownership.`},

/* ---------- Macro Indicators & Policy (additions) ---------- */
{t:'M2 money supply',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The broad count of cash, deposits, and near-cash in the economy`,d:`The broad measure of money in the economy — currency, checking and savings deposits, money market funds. Monetarists hold that its growth ultimately drives inflation ("too much money chasing too few goods"), a view that looked vindicated when the 2020-21 surge of roughly 40% preceded the inflation spike, and complicated when its 2023 contraction — the first since the 1930s — preceded no deflation. A regime indicator, not a timing tool.`},
{t:'Velocity of money',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`How many times each dollar turns over in a year`,d:`How many times the average dollar changes hands in a year — GDP divided by the money supply. It's the missing variable in every monetarist argument: printing money is only inflationary if the money moves. QE's trillions largely sat in bank reserves (velocity collapsed), which is why 2010s inflation hawks were wrong; the 2021 stimulus went to households who spent it, which is why the same warning finally landed.`},
{t:'Output gap',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The distance between actual GDP and the economy's full capacity`,d:`The distance between actual GDP and potential GDP — what the economy could produce at full employment without stoking inflation. Slack (running below capacity) argues for stimulus; overheating argues for restraint. The catch that humbles policymakers: potential output is unobservable and estimated with huge error bars, so policy is perpetually steering by a landmark nobody can actually see.`},
{t:'Neutral rate (r-star)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The unobservable interest level that neither stimulates nor restrains`,d:`The theoretical real interest rate that neither stimulates nor restrains the economy — the line dividing "tight" policy from "easy." Every Fed debate implicitly argues about where it sits: if it rose post-pandemic (deficits, AI capex, deglobalization), then policy that looks restrictive by 2010s standards barely binds. Unobservable and estimated only in hindsight, it's the most consequential number in macro that nobody can measure.`},
{t:'Taylor rule',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`A formula prescribing the policy rate from inflation and slack`,d:`John Taylor's formula prescribing where the policy rate should sit based on how far inflation is from target and output from potential. No central bank follows it mechanically, but it's the universal benchmark for judging whether policy is ahead of or behind the curve — and in 2021 its variants screamed for hikes many months before the Fed moved, which is now Exhibit A in the "too late" critique.`},
{t:'Phillips curve',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The contested tradeoff between unemployment and inflation`,d:`The posited inverse relationship between unemployment and inflation — tight labor markets bid up wages, which feed prices. It anchored postwar policy, broke down in the stagflationary 1970s, went mysteriously flat in the 2010s (low unemployment, no inflation), then partially reasserted itself post-pandemic. Its slope is arguably the most consequential open question in macroeconomics: it determines how much pain disinflation requires.`},
{t:'Breakeven inflation',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The price-growth forecast extracted from the gap between two bond yields`,d:`The market's implied inflation forecast, read from the yield gap between nominal Treasuries and TIPS of the same maturity. The 5-year/5-year-forward version is the Fed's preferred gauge of whether long-run expectations remain anchored. Its power is that it's a price, not a survey — real money changing hands — though liquidity distortions mean it's read with care in stressed markets.`},
{t:'Steepeners & flatteners',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Trades on the changing shape of the yield curve`,d:`Macro trades expressing views on the yield curve's shape rather than its level — betting the gap between short and long yields widens or narrows. The vocabulary matters: a "bull steepener" (short rates falling as the Fed cuts) is the classic recession trade; a "bear steepener" (long rates rising on supply or inflation fear) is the fiscal-worry trade. Curve shape is the bond market's narrative in one number.`},
{t:'Initial jobless claims',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The weekly count of new unemployment filings; the fastest labor signal`,d:`The weekly count of new filings for unemployment insurance — the highest-frequency read on the labor market, published every Thursday. Its virtue is speed: it's hard data (actual filings, not surveys) that turns within weeks of the economy cracking. A sustained climb toward 300K+ has preceded most recessions, which is why traders watch a boring administrative statistic like a hawk.`},
{t:'JOLTS',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The report tracking job openings, quits, and hiring churn`,d:`The Job Openings and Labor Turnover Survey — openings, hires, quits, and layoffs. It rose from obscurity to market-mover during the inflation fight because it measures labor market tightness directly: the ratio of openings to unemployed workers (which hit a historic 2:1 in 2022) became the Fed's favored slack gauge, and the quits rate is the cleanest read on worker confidence — people don't quit into a bad market.`},
{t:'Retail sales',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The monthly read on consumer spending at stores and online`,d:`The Census Bureau's monthly measure of consumer spending on goods — the highest-frequency window into the engine that is two-thirds of U.S. GDP. Markets trade the "control group" version (stripping autos, gas, food service) that feeds GDP math. Its limitation matters increasingly: it's goods-heavy in a services economy, so a resilient print can coexist with a consumer quietly trading down.`},
{t:'Consumer confidence & sentiment',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Survey measures of household mood about the economy`,d:`The survey twins — the Conference Board's index (labor-market weighted) and the University of Michigan's (inflation-expectation weighted) — measuring how households feel about conditions ahead. Their forecasting record is mediocre; their inflation-expectations components are what the Fed actually watches. The recent puzzle ("vibecession") — sour survey readings amid strong hard data — became a macro story in its own right.`},
{t:'Housing starts & permits',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`New residential construction; the economy's most rate-sensitive sector`,d:`Monthly counts of new residential construction begun and authorized — the most interest-rate-sensitive corner of the real economy, and historically its best leading indicator. Housing is the transmission mechanism of monetary policy: rate hikes hit mortgages, construction, and everything downstream (appliances, furniture, remodeling) first. Ed Leamer's famous paper title still summarizes the field: housing IS the business cycle.`},
{t:'ECI (Employment Cost Index)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The cleanest quarterly measure of wage and benefit growth`,d:`The quarterly measure of wages and benefits, controlled for workforce composition — unlike average hourly earnings, it isn't distorted when low-wage workers get laid off (which mechanically "raises" average pay). That cleanliness makes it the Fed's preferred wage gauge, watched for wage-price spiral dynamics: growth near 3.5% is roughly consistent with 2% inflation plus productivity; well above that, services inflation stays sticky.`},
{t:'Hawks vs. doves',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The shorthand taxonomy of central bankers' policy leanings`,d:`The ornithology of central banking: one camp weights the inflation half of the mandate and leans toward tighter policy; the other weights employment and leans easier. Every FOMC speech gets scored on this axis, because the committee's center of gravity — not the chair alone — sets the path. Handicapping rotations of regional presidents into voting seats by their plumage is a genuine, if slightly absurd, professional skill.`},
{t:'Fed put',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The belief that the central bank rescues falling markets`,d:`The market's belief that the central bank will ease policy to arrest any serious market decline — implicit insurance, named for the option it resembles. Born under Greenspan in 1987 and reinforced across every crisis since, it systematically encourages risk-taking (a clean case of moral hazard at civilizational scale). Its 2022 suspension — hiking into a bear market because inflation outranked asset prices — was the era's defining regime shock.`},
{t:'Financial conditions',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The composite of rates, spreads, stocks, and the dollar that transmits policy`,d:`The composite of borrowing rates, credit spreads, equity prices, and the dollar through which monetary policy actually reaches the economy — tracked in indices from Goldman, the Chicago Fed, and Bloomberg. The subtlety that moves markets: the Fed sets one overnight rate, but this composite can ease while the Fed holds (stocks rally, spreads tighten), effectively undoing tightening — which is why Powell discusses it constantly.`},
{t:'Sahm rule',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`A recession trigger based on unemployment's rise from its recent low`,d:`Claudia Sahm's empirical trigger: when the three-month average unemployment rate rises half a point above its twelve-month low, a recession has historically already begun — with a near-perfect postwar record. Designed as an automatic-stimulus trigger, adopted by markets as a real-time recession detector. Its 2024 triggering without an apparent recession became the exception testing it, and a case study in indicators bending under observation.`},
{t:'Current account & trade balance',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`A country's net position with the rest of the world`,d:`Exports minus imports is the narrower measure; adding investment income and transfers gives the broader one — together, a country's net financial position with the world. A deficit isn't inherently bad: it means foreigners are financing domestic consumption and investment, sustainable as long as they want your assets. The U.S. runs perpetual deficits precisely because the world wants dollars and Treasuries — the "exorbitant privilege" of the reserve currency.`},
{t:'Anchored inflation expectations',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Public confidence that price growth returns to target regardless of shocks`,d:`The state in which households, firms, and markets believe price growth will return to target regardless of short-term shocks — the central bank's most valuable asset. When the anchor holds, spikes fade on their own; when it slips, they feed wage demands and pricing behavior that become self-fulfilling (the 1970s disease). The whole hawkish playbook of 2022 was, at bottom, a campaign to keep it from slipping.`},


/* ---------- Street Jargon & Shorthand ---------- */
{t:'Risk-on / risk-off',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`The market's binary mood: chasing upside or hiding in safety`,d:`The market's two moods, compressed into desk shorthand. In the first, capital chases stocks, high yield, EM, and crypto; in the second it hides in Treasuries, the dollar, and gold. What makes the framing useful is correlation: on these days, assets stop trading on their own fundamentals and move as one giant sentiment trade — which is exactly when diversification quietly stops working.`},
{t:'Talk your book',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Publicly praising positions you already own`,d:`Publicly advocating views that benefit your existing positions — the fund manager on CNBC pitching a stock they bought months ago. Not illegal, universally practiced, and the reason every media appearance by an investor should be read with the question: what do they own, and does my buying help them? The disclosure line at the bottom of the screen is doing heavy lifting.`},
{t:'The tape',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Desk shorthand for live market price action`,d:`Old shorthand (from ticker tape) for the live flow of prices and trades. "Watching it," "fighting it," "don't fight it" — the phrases encode a real epistemology: price action is information, and a stock that won't go down on bad news is telling you something about positioning. "The tape doesn't lie" is the trader's version of revealed preference.`},
{t:'Print',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`A trade or data point that officially hit the record`,d:`A trade that executed, or a data release that landed — "the CPI print," "a $2B block printed after the close." The connotation is officialness: a print is a fact on the record, as opposed to a quote, a rumor, or an estimate. When someone says a stock "printed" a price, money actually changed hands there.`},
{t:'Axe',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`A dealer's strong standing interest to buy or sell something`,d:`A dealer's strong standing interest — "we're axed to buy convertibles" means they want that trade and will price it aggressively. Knowing who holds one is genuine trading edge: you get better execution selling to someone who wants what you have. Derived meaning: the analyst known as "the" authority on a stock is the axe on that name.`},
{t:'Whisper number',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`The unofficial expectation a company must really beat`,d:`The market's true, unofficial earnings expectation — often above the published consensus after a strong run. It explains the recurring mystery of a company beating estimates and selling off anyway: it beat the printed number but missed the real one. Positioning and options pricing reveal it better than any survey.`},
{t:'Dead cat bounce',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`A brief, false rally inside an ongoing collapse`,d:`A sharp but temporary rally inside a larger decline — short covering and bargain hunters producing a bounce that fails and rolls to new lows. The gallows-humor etymology: even a dead cat bounces if dropped from high enough. Distinguishing one from a genuine bottom is, inconveniently, only possible in hindsight — which is the actual lesson.`},
{t:'Catching a falling knife',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Buying into a violent decline before it's found a floor`,d:`Buying an asset in free fall on the theory that it's cheap — and discovering that "down 60%" can still fall another 60%. The warning embedded in the phrase is about process: declines driven by leverage unwinds and forced selling overshoot, but so do declines driven by the thesis being wrong. Waiting for stabilization costs some upside and avoids a lot of severed fingers.`},
{t:'Melt-up',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`A rapid, fear-of-missing-out-driven surge to the upside`,d:`A rapid, almost involuntary surge in prices driven not by fundamentals but by capitulating bears, under-invested managers chasing benchmarks, and FOMO — the crash's upside mirror. The term carries a warning label: these moves are how bull markets end, sucking in the last capital at the worst prices. Career risk fuels it; managers get fired for missing rallies, not for losing money alongside everyone else.`},
{t:'Goldilocks economy',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Growth warm enough to lift earnings, cool enough to spare rates`,d:`An economy running "not too hot, not too cold" — growth strong enough to support earnings, inflation tame enough to keep the central bank friendly. It's the regime equities love most, and the word to listen for in strategist commentary: when everyone agrees conditions are perfect, positioning is usually full, and the setup is maximum vulnerability to either a hot inflation print or a growth scare.`},
{t:'Market color',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Qualitative intel on who's buying, who's selling, and why`,d:`The qualitative texture around price action — who's buying, who's selling, in what size, with what urgency. "Any color on the move?" is the standard desk question, and providing good color is a big part of what sell-side sales and trading actually sells. It's information that never appears in a data feed, which is precisely why relationships with dealers still matter.`},
{t:'Constructive / cautious',c:'Finance',g:'Street Jargon & Shorthand',sg:'Street Jargon & Shorthand',q:`Street-speak for bullish and bearish, with plausible deniability`,d:`The Street's hedged vocabulary for directional views: the first means bullish, the second bearish — but softened enough to survive being wrong. The dialect exists because careers punish memorable wrong calls; fluency means hearing "we're incrementally more constructive on duration" and translating it instantly to "we're buying bonds." The stronger the conviction, the plainer the language — which is itself a signal.`},

/* ---------- Markets & Trading (IPO machinery & desk essentials) ---------- */
{t:'Sell side vs. buy side',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The Street's two halves: service providers versus capital deployers`,d:`The industry's fundamental division: one side (investment banks, brokers, research) sells services, execution, and ideas; the other (funds, asset managers, allocators) deploys capital and consumes them. The incentive structures differ completely — one is paid on transactions and relationships, the other on performance. Knowing which side someone sits on tells you how to read everything they say; research from the transaction-paid side is marketing as much as analysis.`},
{t:'Bookbuilding',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Underwriters collecting investor orders to price a new offering`,d:`The process by which underwriters price an IPO or offering: collecting indications of interest from institutional investors — who wants how many shares at what price — into a demand ledger. A deal "multiple times oversubscribed" has demand far exceeding supply, letting bankers price higher and allocate selectively. Allocation is the quiet power: hot deals go to the underwriter's best clients, which is a currency of its own.`},
{t:'Greenshoe',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The overallotment option underwriters use to stabilize new listings`,d:`The overallotment option in an IPO: underwriters sell ~15% more shares than the base deal, then either buy them back in the market (supporting a falling price) or exercise the option for more shares from the company (if the price rises). It's legalized price stabilization, named for the 1963 Green Shoe Manufacturing deal that pioneered it. Every "why isn't this broken IPO falling further" has this as a suspect for the first 30 days.`},
{t:'Follow-on offering',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`An already-public company selling additional shares`,d:`A share sale by a company that's already public — primary (new shares, cash to the company, dilutive) or secondary (insiders selling out, no dilution but a signal worth reading). The stock usually dips on announcement: supply is coming, and management just told you what they think of the current price. Biotechs live on these; the timing pattern — raise after good news — is nearly universal.`},
{t:'Block trade',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`A single massive share sale negotiated off the open market`,d:`A very large share sale — typically $50M+ — negotiated privately, usually with a bank that buys the whole position at a discount and resells it. The mechanics exist because dumping size on the open market would crater the price. When one prints, the questions cascade: who sold, why, and does someone know something? The Archegos unwind of 2021 was history's most violent sequence of them.`},
{t:'Margin call',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The broker's demand for more collateral as levered positions sink`,d:`The demand for additional collateral when a leveraged position moves against you — post cash or be liquidated. It's the transmission mechanism that turns declines into crashes: forced sellers don't consider valuation, their selling pushes prices lower, triggering the next investor's demand in a cascade. Nearly every blowup — 1929, LTCM, 2008, Archegos — is at bottom this mechanism operating at scale.`},

/* ---------- Accounting & Business Quality (filings fluency) ---------- */
{t:'MD&A',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`The filing section where management explains the numbers in prose`,d:`Management's Discussion & Analysis — the section of the 10-K and 10-Q where management explains results, trends, liquidity, and risks in prose. It's where the analytical action lives: segment detail, the "why" behind margin moves, and language changes quarter over quarter. Professionals diff it against the prior filing; a new sentence about "pricing pressure" or a dropped mention of a growth driver is often the earliest public signal of trouble.`},
{t:'Audit opinion & going concern',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`The independent accountant's verdict, and the flag questioning survival itself`,d:`The independent auditor's verdict on the financial statements. An unqualified ("clean") opinion is the unremarkable norm — which is exactly why deviations matter enormously: a qualified opinion, a material weakness in controls, or the dreaded doubt about the company's ability to continue operating. That last flag questions survival itself and typically craters the stock; auditor resignations mid-year are an even louder alarm.`},
{t:'Restatement',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`A company formally admitting its past financials were wrong`,d:`A formal correction of previously issued financial statements — the company admitting the numbers investors relied on were wrong. Severity ranges from technical reclassifications to fraud (Enron's was the beginning of the end). The signal value is asymmetric: even "minor" ones damage the credibility premium a management team trades on, and research shows companies that restate once are disproportionately likely to do it again.`},
{t:'Pro forma',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Financials presented "as if" — adjusted for deals or hypotheticals`,d:`Financials presented "as if" — as if the acquisition had closed a year ago, as if the one-time charges hadn't happened. Legitimate use: making a merged company's history comparable. Abusive use: EBITDA "adjusted" beyond recognition in credit documents, where addbacks for projected synergies and "normalized" costs let borrowers claim leverage ratios far below reality. The word should trigger one reflex: adjusted by whom, and for what?`},
{t:'Run-rate',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Extrapolating the latest period as if it continues all year`,d:`Annualizing the most recent period — December revenue times twelve, the latest quarter times four. Useful for fast-changing businesses where trailing twelve months is stale; dangerous because it assumes the best recent period is the new normal and ignores seasonality. "Run-rate ARR" in a pitch deck deserves the immediate question: what happens to that number if the latest month was the anomaly?`},
{t:'Mark-to-market',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Carrying positions at today's price and recognizing the swing`,d:`Valuing positions at current market prices and running the changes through earnings or equity — as opposed to historical cost. It keeps books honest in liquid markets and becomes contested exactly where prices vanish: in 2008 the debate over marking mortgage assets in a frozen market was genuinely hard. The private-fund version is the "mark" — and the gap between private marks and what assets fetch in actual sales is a perpetual source of flattering IRRs.`},
{t:'Fair value hierarchy (Levels 1–3)',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`The three-tier ranking of how observable an asset's price is`,d:`Accounting's honesty ranking for valuations: quoted prices in active markets; values derived from observable inputs; and values from the company's own models and assumptions. The third tier — "mark-to-model," or less charitably mark-to-myth — is where banks' exotic assets and funds' illiquid positions live. Watching a company's asset mix migrate toward it is watching valuation certainty degrade in real time; the footnotes disclose the breakdown.`},
{t:'Backlog & book-to-bill',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Contracted future work, and whether new orders outpace current invoicing`,d:`Backlog is contracted work not yet delivered or recognized as revenue — the order book of defense contractors, builders, and equipment makers. Book-to-bill divides new orders by current billings: above 1.0, the future is growing faster than the present. Together they're the closest thing cyclical industrials have to SaaS's revenue visibility, and the first place to look when judging whether reported growth has legs.`},
{t:'Same-store sales',c:'Finance',g:'Accounting & Business Quality',sg:'Company & Business-Quality Metrics',q:`Growth from existing locations only, stripping out expansion`,d:`Revenue growth from locations open at least a year — isolating organic health from the sugar high of opening new units. A retailer can grow total revenue for years while each store quietly deteriorates; this metric (also "comps" or "comparable sales") is what catches it. When a chain's expansion story meets negative comps, the market's judgment is usually swift and correct.`},

/* ---------- Valuation & Deals (banking layer) ---------- */
{t:'EBITDA bridge',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The waterfall chart walking from last year's profit to this year's`,d:`The waterfall exhibit decomposing the change in earnings from one period to the next — starting figure, then bars for volume, price, cost inflation, FX, one-timers, ending figure. Ubiquitous in board decks, lender presentations, and PE reporting because it converts "EBITDA fell 8%" into an argument about why. Reading one critically means asking which bars are measured and which are plugs.`},
{t:'Bulge bracket',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The tier of the largest global investment banks`,d:`The top tier of global investment banks — Goldman, Morgan Stanley, JPMorgan and peers — named for where their logos sit on a deal prospectus. The counterpoint is the elite boutiques (Evercore, Centerview, Lazard) selling conflict-free advice without lending relationships. The distinction matters for careers and for reading deals: which banks appear on a transaction, and in what order, encodes the relationships and the fees.`},
{t:'League tables',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The rankings of banks by deal volume that drive Street behavior`,d:`Rankings of investment banks by deal volume — M&A advised, equity underwritten, debt issued. They look like trivia and function as economics: position drives mandates ("hire the #1 tech bank"), so banks fight for credit on every deal and sometimes do marginal business just for the table position. Understanding that scoreboard explains a surprising amount of otherwise irrational banker behavior.`},
{t:'Roadshow',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Management's investor tour to sell a deal before pricing`,d:`The pre-deal marketing tour: management and bankers pitching institutional investors city by city (now often virtually) ahead of an IPO or offering, feeding demand into the bookbuild. For the buy side it's the rare chance to pressure-test management directly; for the company it's a career-defining performance. The quality of questions asked in those rooms is a real signal of which investors did the work.`},

/* ---------- Fixed Income, Credit & Derivatives (instruments that make headlines) ---------- */
{t:'Convertible bond',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Debt with an embedded right to become equity`,d:`A bond that can convert into a preset number of shares — debt with an embedded call option on the stock. Issuers get cheaper coupons (the option has value); investors get downside protection with equity upside. It's also an ecosystem: convertible arbitrage funds buy the bond and short the stock to isolate the option. MicroStrategy's Bitcoin machine ran on these — the modern case study in the instrument's power and reflexivity.`},
{t:'Warrant',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`A long-dated right to buy shares, issued by the company itself`,d:`A long-dated option to buy shares at a set price — issued by the company itself, so exercise creates new shares and dilution (unlike exchange-traded options, which are side bets between investors). They travel as deal sweeteners: attached to junk bonds, SPAC units, and rescue financings. Buffett's crisis-era deals — preferred stock plus warrants — are the canonical example of getting paid to provide capital while keeping the upside.`},
{t:'Revolver (credit facility)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Credit & the Debt Side',q:`A committed corporate borrowing line, drawn and repaid as needed`,d:`A committed bank line a company can draw, repay, and redraw — the corporate credit card, usually undrawn and paying a small commitment fee. Its information value spikes in stress: companies drawing down fully ("revolver draws") signal they fear the line disappearing, as in March 2020's dash for cash. In an LBO capital stack it sits most senior; in a credit crunch it's the canary.`},
{t:'Commercial paper',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Ultra-short unsecured corporate IOUs for daily funding`,d:`Unsecured corporate IOUs maturing in days to months — how blue-chip companies fund payroll and inventory at rates below bank loans. Invisible in normal times, systemic in crises: because it must be constantly rolled over, a freeze (2008 post-Lehman, when the market seized) instantly threatens even healthy companies' ability to operate. The Fed's repeated backstops of this market reveal how essential the plumbing is.`},
{t:'Haircut',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Credit & the Debt Side',q:`The discount applied to collateral, or the loss creditors accept`,d:`Two related uses: the discount applied to collateral value when lending against it (post $100 of bonds, borrow $95 — the trim is the lender's cushion), and the loss creditors accept in a restructuring ("bondholders took a 40% haircut"). The first meaning is quietly macro-critical: when repo lenders raise these across the system, leverage contracts everywhere simultaneously — a mechanism at the heart of 2008.`},
{t:'Total return swap',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`A contract delivering an asset's full economics without owning it`,d:`A derivative in which one party pays the total economic return of an asset — price moves plus dividends — while the other pays a financing rate. The economics of ownership with no shares changing hands: leverage without disclosure, since positions held this way historically escaped 13F filings. Archegos built $100B+ of hidden, concentrated exposure through these across multiple banks; the 2021 collapse is now the instrument's defining case study.`},

/* ---------- Hedge Funds & Private Markets (the modern industry) ---------- */
{t:'Pod shop (multi-manager)',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Hedge Fund Strategies',q:`Dozens of siloed teams under one risk system and tight leash`,d:`The dominant hedge fund model of the era — Citadel, Millennium, Point72: dozens of autonomous teams ("pods") each running tightly risk-limited books, market-neutral by construction, with ruthless capital reallocation and quick termination for drawdowns. The centralized risk engine nets exposures across pods and levers the blended book. It industrialized alpha generation — and its war for talent reshaped compensation across the entire industry.`},
{t:'Pass-through fees',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Hedge Fund Strategies',q:`Charging every operating cost to investors on top of the incentive cut`,d:`The multi-manager fee model: instead of a fixed management fee, all costs — trader compensation, technology, data, rent — pass directly to investors, plus a performance fee on top. Total expense loads can reach 5-8% of assets in strong years, versus the traditional 2%. Investors have accepted it because net returns stayed strong and uncorrelated; it's the clearest evidence that allocators pay for what's scarce, not what's cheap.`},
{t:'13F',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Hedge Fund Strategies',q:`The quarterly filing revealing big managers' stock holdings`,d:`The quarterly SEC filing where managers over $100M disclose their U.S. equity holdings — the window through which the world tracks what Buffett, Burry, and every major fund own. Read with three caveats: it's up to 45 days stale, shows longs only (shorts and derivatives are invisible — a fund can look bullish while net short), and excludes non-U.S. positions. Whole products are built on cloning these; the smart money knows exactly what it reveals and times accordingly.`},
{t:'Crowded trade',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Hedge Fund Strategies',q:`A position so consensus that the exit has no room`,d:`A position held by so many funds that the exit becomes the risk — when everyone owns the same names with leverage, any shock forces simultaneous selling into no bids. Prime brokers publish positioning data precisely so clients can see the crowding; the recurring pattern (quant quake 2007, GameStop shorts 2021, yen carry 2024) is that the trade's popularity, not its logic, is what kills it. "What's consensus?" is a risk question, not a sentiment survey.`},
{t:'Subscription line',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`Fund-level borrowing that delays capital calls and flatters IRR`,d:`A credit line a PE fund uses to make investments before calling LP capital — operationally convenient, and quietly transformative for reported returns: delaying the capital call shortens the measured holding period, mechanically inflating IRR without creating a dollar of value. Now near-universal, which corrupts comparisons against older vintages. Sophisticated LPs ask for returns computed both ways; the gap is the financial engineering.`},
{t:'Basis trade',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Hedge Fund Strategies',q:`Levered arbitrage of tiny gaps between cash bonds and futures`,d:`The giant relative-value trade in Treasuries: buy the cash bond, short the futures contract, capture the tiny pricing gap between them — then apply 50-100x repo leverage to make basis points matter. Hedge funds run it at hundreds of billions in scale, which is why regulators obsess over it: in March 2020 the unwind amplified the Treasury market seizure. The textbook example of how "riskless" arbitrage plus leverage equals systemic risk.`},

/* ============================== state ============================== */
let state={ terms:[], resources:[], progress:{}, view:'library', scope:'all', query:'' };

function seedTerms(){
  return SEED.map(s=>({ id:slug(s.t)||uid(), term:s.t, def:s.d, q:s.q||'', category:s.c, group:s.g, sg:s.sg||s.g }));
}
const SEED_VERSION=5;
async function migrateSeed(){
  const v=await Store.get('seedVersion')||1;
  if(v>=SEED_VERSION) return;
  const fresh=seedTerms();
  const byId=new Map(state.terms.map(t=>[t.id,t]));
  fresh.forEach(f=>{
    const ex=byId.get(f.id);
    if(!ex){ state.terms.push(f); }
    else { ex.def=f.def; ex.q=f.q; ex.category=f.category; ex.group=f.group; ex.sg=f.sg; }
  });
  await Store.set('terms',state.terms);
  await Store.set('seedVersion',SEED_VERSION);
}
function maskDef(t){
  const words=t.term.replace(/\(.*?\)/g,' ').split(/[^A-Za-z0-9]+/).filter(w=>w.length>2);
  let d=(t.def||'').split(/\.\s+/).slice(0,2).join('. ');
  words.forEach(w=>{
    const safe=w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    d=d.replace(new RegExp('\\b'+safe+'\\w*','gi'),'___');
  });
  if(d.length>240) d=d.slice(0,240).replace(/\s\S*$/,'')+'\u2026';
  return d;
}
function clue(t){ return (t.q&&t.q.trim())? t.q : maskDef(t); }
function pstatus(id){ const p=state.progress[id]; if(!p) return 'new'; if(p.streak>=2) return 'known'; if(p.wrong>0||p.streak>0) return 'learning'; return 'new'; }
function mark(id,correct){
  const p=state.progress[id]||{correct:0,wrong:0,streak:0};
  if(correct){p.correct++;p.streak++;}
  else {p.wrong++;p.streak=0;p.lapses=(p.lapses||0)+1;p.due=Date.now();}
  p.last=Date.now(); state.progress[id]=p; Store.set('progress',state.progress);
}
/* ---- spaced repetition (SM-2 family) ---- */
const DAY=86400000, NEW_PER_SESSION=10;
function srsGrade(id,grade){
  const p=state.progress[id]||{correct:0,wrong:0,streak:0};
  if(p.ease==null)p.ease=2.5; if(p.iv==null)p.iv=0;
  p.reps=(p.reps||0)+1;
  if(grade==='again'){
    p.wrong++; p.streak=0; p.lapses=(p.lapses||0)+1;
    p.ease=Math.max(1.3,p.ease-0.2); p.iv=0; p.due=Date.now()+10*60000;
  } else if(grade==='good'){
    p.correct++; p.streak++;
    p.iv = p.iv<1 ? 1 : Math.round(p.iv*p.ease);
    p.due=Date.now()+p.iv*DAY;
  } else {
    p.correct++; p.streak++;
    p.iv = p.iv<1 ? 3 : Math.round(p.iv*p.ease*1.3);
    p.ease=Math.min(3.2,p.ease+0.08);
    p.due=Date.now()+p.iv*DAY;
  }
  p.last=Date.now(); state.progress[id]=p; Store.set('progress',state.progress);
  return p.iv;
}
function dueTerms(){
  const now=Date.now();
  return state.terms.filter(t=>{ const p=state.progress[t.id]; return p && (p.due==null || p.due<=now); });
}
function unseenTerms(){ return state.terms.filter(t=>!state.progress[t.id]); }
function leeches(){
  return state.terms.filter(t=>{ const p=state.progress[t.id]; return p && (p.lapses||0)>=3; })
    .sort((a,b)=>(state.progress[b.id].lapses||0)-(state.progress[a.id].lapses||0));
}
function coreOf(def){
  const m=(def||'').match(/^[^.!?]*[.!?]/);
  if(!m) return {core:def,rest:''};
  return {core:m[0], rest:def.slice(m[0].length).trim()};
}
const SCHEMA={
 'Markets & Trading':'How do securities actually get issued, priced, and traded?',
 'Accounting & Business Quality':'What do the statements say, and is this a good business?',
 'Valuation & Deals':'What is it worth, and how does ownership change hands?',
 'Fixed Income, Credit & Derivatives':'Who gets paid back first, at what rate, and what is built on top?',
 'Funds: Structures, Access & Economics':'Who can invest, through what vehicle, and how does the manager get paid?',
 'Hedge Funds & Private Markets':'What are the strategies, and how does the private capital lifecycle work?',
 'Portfolio, Risk & Performance':'How do you judge an investment, a portfolio, and a manager?',
 'Street Jargon & Shorthand':'What does the desk actually say, and what does it really mean?',
 'Macro, Rates & Policy':'What moves the whole board: the Fed, the data, the price of money?',
 'Economic Principles & Behavior':'What are the underlying laws of incentives, markets, and human error?',
};

async function init(){
  let t=await Store.get('terms');
  if(!t||!t.length){ t=seedTerms(); await Store.set('terms',t); await Store.set('seedVersion',SEED_VERSION); }
  state.terms=t;
  await migrateSeed();
  state.resources=await Store.get('resources')||[];
  state.progress=await Store.get('progress')||{};
  render();
}

/* ============================== helpers for grouping ============================== */
function groupsFor(cat){
  const seen=new Set(); const ordered=[];
  GROUP_ORDER.filter(([c])=>c===cat).forEach(([,g])=>{ if(state.terms.some(t=>t.category===cat&&t.group===g)){seen.add(g);ordered.push(g);} });
  state.terms.filter(t=>t.category===cat).forEach(t=>{ if(!seen.has(t.group)){seen.add(t.group);ordered.push(t.group);} });
  return ordered;
}
function categories(){
  const seen=new Set(); const out=[];
  GROUP_ORDER.forEach(([c])=>{ if(!seen.has(c)&&state.terms.some(t=>t.category===c)){seen.add(c);out.push(c);} });
  state.terms.forEach(t=>{ if(!seen.has(t.category)){seen.add(t.category);out.push(t.category);} });
  return out;
}
function termsInScope(){
  let arr=state.terms;
  if(state.scope!=='all'){ const [c,g]=state.scope.split('||'); arr=arr.filter(t=>t.category===c&&(g==='*'||t.group===g)); }
  if(state.query){ const q=state.query.toLowerCase(); arr=arr.filter(t=>(t.term+' '+t.def).toLowerCase().includes(q)); }
  return arr;
}

/* ============================== render: shell ============================== */
function render(){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view));
  const m=$('#main');
  if(state.view==='library') m.innerHTML=viewLibrary();
  else if(state.view==='study') m.innerHTML=viewStudy();
  else if(state.view==='quiz') m.innerHTML=viewQuiz();
  else if(state.view==='compare') m.innerHTML=viewCompare();
  else if(state.view==='resources') m.innerHTML=viewResources();
  wire();
}

/* ============================== view: library ============================== */
function viewLibrary(){
  const cats=categories();
  let idx=`<button class="all ${state.scope==='all'?'on':''}" data-scope="all">All terms <span style="font-family:var(--mono);font-size:11px;float:right;opacity:.7">${state.terms.length}</span></button>`;
  let n=0;
  cats.forEach(cat=>{
    n++;
    idx+=`<div class="cat"><button class="cathead" data-scope="${esc(cat)}||*"><span class="num">${String(n).padStart(2,'0')}</span>${esc(cat)}</button>`;
    groupsFor(cat).forEach(g=>{
      const ct=state.terms.filter(t=>t.category===cat&&t.group===g).length;
      const sc=cat+'||'+g;
      idx+=`<button class="grp ${state.scope===sc?'on':''}" data-scope="${esc(sc)}">${esc(g)}<span class="ct">${ct}</span></button>`;
    });
    idx+=`</div>`;
  });

  const arr=termsInScope();
  let title='All terms', eyebrow='Library', desc='Your full corpus. Browse by concept on the left, or search up top.';
  if(state.scope!=='all'){ const [c,g]=state.scope.split('||'); eyebrow=c; title=g==='*'?c:g; desc=g==='*'?'Every concept group in '+c+'.':''; }
  if(state.query){ eyebrow='Search'; title='“'+state.query+'”'; desc=arr.length+' match'+(arr.length===1?'':'es')+'.'; }

  let cards=arr.map(t=>termCard(t)).join('');
  if(!arr.length) cards=`<div class="empty"><div class="big">Nothing here yet</div>${state.query?'No terms match your search.':'Add your first term to this group.'}</div>`;

  return `
  <div class="lib">
    <aside class="index" id="indexPanel">
      <h4>Concept map</h4>
      ${idx}
    </aside>
    <section class="panel">
      <div class="panelhead">
        <div>
          <div class="eyebrow">${esc(eyebrow)}</div>
          <h2>${esc(title)}</h2>
          ${desc?`<p>${esc(desc)}</p>`:''}
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost sm menubtn" id="menuToggle">☰ Map</button>
          <button class="btn sm" id="addTerm">+ Add term</button>
        </div>
      </div>
      <div class="terms">${cards}</div>
    </section>
  </div>`;
}
function termCard(t){
  const st=pstatus(t.id);
  return `<article class="term collapsed" data-id="${esc(t.id)}">
    <div class="tline">
      <h3>${esc(t.term)}</h3>
      <div class="meta"><span class="grouptag">${esc(t.group)}</span><span class="dot ${st}" title="${st}"></span></div>
    </div>
    <p class="def">${esc(t.def)}</p>
    <div class="acts">
      <button class="btn ghost sm" data-act="edit" data-id="${esc(t.id)}">Edit</button>
      <button class="btn ghost sm" data-act="del" data-id="${esc(t.id)}"><span class="danger">Delete</span></button>
    </div>
  </article>`;
}

/* ============================== view: study (flashcards) ============================== */
let deck={cards:[],i:0,flipped:false};
function buildScopeOptions(sel){
  let o=`<option value="all">All terms (${state.terms.length})</option>`;
  categories().forEach(cat=>{
    o+=`<option value="${esc(cat)}||*">${esc(cat)} — all</option>`;
    groupsFor(cat).forEach(g=>{
      const ct=state.terms.filter(t=>t.category===cat&&t.group===g).length;
      o+=`<option value="${esc(cat)}||${esc(g)}" ${sel===cat+'||'+g?'selected':''}>&nbsp;&nbsp;${esc(g)} (${ct})</option>`;
    });
  });
  return o;
}
function scopeTerms(scope){
  if(scope==='all') return state.terms;
  const [c,g]=scope.split('||'); return state.terms.filter(t=>t.category===c&&(g==='*'||t.group===g));
}
function viewStudy(){
  if(studyMode==='review') return viewReview();
  return viewBrowse();
}
let studyMode='review';
let rev={cards:[],i:0,flipped:false,done:0,again:0,active:false};
function buildReviewQueue(){
  const due=shuffle(dueTerms());
  const fresh=shuffle(unseenTerms()).slice(0,NEW_PER_SESSION);
  rev={cards:shuffle(due.concat(fresh)),i:0,flipped:false,done:0,again:0,active:true,dueN:due.length,newN:fresh.length};
}
function modeBar(){
  return `<div class="modebar">
    <button class="btn sm ${studyMode==='review'?'':'ghost'}" data-smode="review">Daily review</button>
    <button class="btn sm ${studyMode==='browse'?'':'ghost'}" data-smode="browse">Browse</button>
  </div>`;
}
function viewReview(){
  if(!rev.active) buildReviewQueue();
  if(!rev.cards.length){
    const lch=leeches().slice(0,4);
    return `<div class="quizwrap">${modeBar()}<div class="card"><div class="empty">
      <div class="big">All clear</div>Nothing due for review. The scheduler will bring cards back right before you'd forget them — check in daily.<br><br>
      ${lch.length?`<span style="color:var(--warn)">Trouble terms to drill in Compare: ${lch.map(t=>esc(t.term)).join(', ')}</span><br><br>`:''}
      <button class="btn sm ghost" data-smode="browse">Browse the library instead</button>
    </div></div></div>`;
  }
  if(rev.i>=rev.cards.length){

    return `<div class="quizwrap">${modeBar()}<div class="card results">
      <div class="score">${rev.done-rev.again} / ${rev.done}</div>
      <div class="sub">graded Good or Easy this session</div>
      ${lch.length?`<p style="font-size:13px;color:var(--muted);margin-top:14px">Leeches (missed 3+ times): <strong>${lch.map(t=>esc(t.term)).join(', ')}</strong> — take them into a boundary drill.</p>`:''}
      <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

    <div class="progbar"><i style="width:${pct}%"></i></div>

        <div class="face front">
          <div class="lab">Recall the definition</div>
          <h2>${esc(c.term)}</h2>
          <div class="grouptag">${esc(c.group)}</div>
          <div class="hint">Answer in your head, then tap to check</div>
        </div>
        <div class="face back">
          <div class="bk-scroll">
            <div class="lab">Definition</div>
            <div class="bk-term">${esc(c.term)}</div>
            <div class="bk-core">${esc(cr.core)}</div>
            <div class="bk-def">${esc(cr.rest)}</div>
          </div>
        </div>
      </div>
    </div>
    ${rev.flipped?`<div class="gradebtns">
      <button class="btn ghost sm" data-grade="again" style="border-color:var(--warn);color:var(--warn)">Again</button>
      <button class="btn sm" data-grade="good">Good</button>
      <button class="btn sm" data-grade="easy" style="background:var(--accent)">Easy</button>
    </div>`:`<div class="gradebtns"><button class="btn sm" id="revFlip" style="width:100%">Show answer</button></div>`}

function viewBrowse(){
  if(!deck.cards.length){ deck.cards=shuffle(scopeTerms(state.scope)); deck.i=0; deck.flipped=false; }

let quiz=null;
function viewQuiz(){
  if(!quiz){
    return `<div class="quizwrap"><div class="card">
      <div class="panelhead" style="margin-bottom:18px"><div><div class="eyebrow">Quiz</div><h2>Test yourself</h2><p>Pick a scope and format. Misses get flagged for review.</p></div></div>
      <div class="field"><label>Scope</label><select id="qScope">${buildScopeOptions(state.scope)}</select></div>
      <div class="row2">
        <div class="field"><label>Format</label><select id="qMode">
          <option value="mc-term">Multiple choice — name the term</option>
          <option value="mc-def">Multiple choice — pick the definition</option>
          <option value="type">Type the term</option>
        </select></div>
        <div class="field"><label>Length</label><select id="qLen">
          <option value="10">10 questions</option><option value="20">20 questions</option><option value="0">All</option>
        </select></div>
      </div>
      <button class="btn" id="startQuiz" style="width:100%;justify-content:center">Start quiz</button>
    </div></div>`;
  }
  if(quiz.done) return quizResults();
  const q=quiz.items[quiz.i];
  const head=`<div class="scoreline"><span>Question ${quiz.i+1} / ${quiz.items.length}</span><span>Score ${quiz.score}</span></div>
    <div class="progbar"><i style="width:${Math.round(quiz.i/quiz.items.length*100)}%"></i></div>`;

  if(quiz.mode==='type'){
    const answered=quiz.answered;
    return `<div class="quizwrap"><div class="card">${head}
      <div class="q-prompt">Name the term</div>
      <div class="q-body">${esc(q.clue)}</div>
      <div class="typed"><input id="typeAns" placeholder="Type the term…" ${answered?'disabled':''} value="${answered?esc(quiz.typed||''):''}"><button class="btn" id="typeSubmit" ${answered?'disabled':''}>Check</button></div>
      ${answered?`<div class="reveal"><div class="r-term">${esc(q.term)}</div><div class="r-def">${esc(q.def)}</div>
        <div class="grade"><button class="btn ghost sm" id="markWrong" style="border-color:var(--warn);color:var(--warn)">I got it wrong</button><button class="btn sm" id="markRight" style="background:var(--accent)">I was right</button></div></div>`:''}
    </div></div>`;
  }

  // multiple choice
  const showDef = quiz.mode==='mc-term';

  const body = showDef? `<div class="q-body">${esc(q.clue)}</div>` : `<div class="q-body term">${esc(q.term)}</div>`;
  const opts=q.options.map((o,k)=>{
    let cls='opt';

    const label = showDef? o.term : o.clue;

  }).join('');
  return `<div class="quizwrap"><div class="card">${head}

    <div class="opts">${opts}</div>

  </div></div>`;
}
function quizResults(){
  const pct=Math.round(quiz.score/quiz.items.length*100);
  const miss=quiz.items.filter(it=>it.missed);
  let ml='';
  if(miss.length){ ml=`<div class="misslist"><h4>Review these (${miss.length})</h4>`+miss.map(it=>`<div class="missitem"><b>${esc(it.term)}</b><div style="font-size:13px;color:var(--muted);margin-top:4px">${esc(it.def)}</div></div>`).join('')+`</div>`; }
  return `<div class="quizwrap"><div class="card results">
    <div class="score">${pct}%</div>
    <div class="sub">${quiz.score} of ${quiz.items.length} correct</div>
    <div style="margin-top:20px;display:flex;gap:8px;justify-content:center">
      ${miss.length?`<button class="btn" id="retryMiss" style="background:var(--warn)">Retry missed (${miss.length})</button>`:''}
      <button class="btn ghost" id="quizAgain">New quiz</button>
    </div>
    ${ml}
  </div></div>`;
}
function buildQuiz(scope,mode,len,pool){
  let terms = pool || scopeTerms(scope);
  terms = shuffle(terms);
  if(len>0) terms=terms.slice(0,len);
  const all=state.terms;
  const items=terms.map(t=>{
    const item={id:t.id,term:t.term,def:t.def,clue:clue(t),missed:false};
    if(mode!=='type'){
      const sameSub=shuffle(all.filter(x=>x.id!==t.id && x.sg && x.sg===t.sg));
      const sameGroup=shuffle(all.filter(x=>x.id!==t.id && x.group===t.group && !(x.sg&&x.sg===t.sg)));
      const sameCat=shuffle(all.filter(x=>x.id!==t.id && x.category===t.category && x.group!==t.group));
      const rest=shuffle(all.filter(x=>x.id!==t.id && x.category!==t.category));
      let pool3=sameSub.concat(sameGroup,sameCat,rest).slice(0,3);
      item.options=shuffle([{term:t.term,clue:item.clue,correct:true},...pool3.map(d=>({term:d.term,clue:clue(d),correct:false}))]);
    }
    return item;
  });
  return {scope,mode,len,items,i:0,score:0,answered:false,picked:-1,typed:'',done:false};
}

function classifyTerm(term,def){
  const text=(' '+term+' '+term+' '+def+' ').toLowerCase();
  let best=null,bestScore=0;
  CAT_KEYWORDS.forEach(([c,g,kws])=>{
    let score=0;
    kws.forEach(k=>{ if(text.includes(k)) score+=(' '+term.toLowerCase()+' ').includes(k)?3:1; });
    if(score>bestScore){bestScore=score;best=[c,g];}
  });
  return bestScore>=2? best : ['Finance','Street Jargon & Shorthand'];
