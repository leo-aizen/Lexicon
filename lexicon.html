{t:'ZIRP-era story / "story stock"',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`A speculative investment that thrived on cheap borrowing, abundant liquidity, and investors' willingness to pay up for growth potential over current profits — pre-IPO unicorns, crypto and meme stocks in 2020–21, the SPAC wave. When rates rose in 2022, this whole cohort re-rated hard — arguably the single most important regime shift of the past decade.`},
{t:'Quantitative easing / tightening (QE / QT)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`QE = the Fed buying bonds to inject liquidity and push down long rates (used when short rates are already at zero); QT = the reverse, draining liquidity. The "quantity of money" lever, alongside the "price of money" (rates) lever.`},
{t:'Real vs. nominal rates',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`Nominal is the stated rate; real is nominal minus inflation — the return that actually grows your purchasing power. Markets care about real rates: a 5% nominal rate with 6% inflation is a negative real rate.`},
{t:'Yield curve',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`The plot of Treasury yields across maturities. Normally upward-sloping; an inverted curve (short rates above long rates) has historically been a recession warning, because it signals markets expect the Fed to cut rates as growth slows.`},
{t:'Inflation',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`The rate at which prices rise, eroding purchasing power. The variable that drives Fed policy, real rates, and ultimately asset valuations.`},
{t:'Flows / positioning / liquidity',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro, Rates & Liquidity',d:`Beyond fundamentals, prices move because of who is forced to buy or sell. Crowded positioning unwinds violently; liquidity conditions determine how far prices move on a given trade. Over short horizons this is often more important than fundamentals.`},

/* ---------- Accounting & Financial Statements ---------- */
{t:'Revenue recognition',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Rules governing when a sale can appear on the income statement`,d:`The accounting rules (ASC 606) governing when a company can record a sale as revenue — generally when performance obligations are satisfied, not when cash arrives. This is where aggressive management teams manipulate results first: pulling revenue forward, booking multi-year contracts upfront, or blurring the line between bookings and revenue. Analysts read revenue recognition policies in the 10-K footnotes precisely because it's the highest-leverage place to inflate the top line.`},
{t:'Accrual vs. cash accounting',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Recording economics when earned versus when money actually moves`,d:`Accrual accounting records revenue when earned and expenses when incurred, regardless of when cash moves — it's the GAAP standard because it matches economic activity to the right period. Cash accounting records only actual cash movement. The gap between the two is exactly why the cash flow statement exists: net income is an opinion shaped by accrual estimates; cash is a fact.`},
{t:'COGS (Cost of Goods Sold)',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`The direct costs of producing whatever a company sells`,d:`The direct costs attributable to producing what a company sells — raw materials, direct labor, manufacturing overhead. Revenue minus this equals gross profit. What lands here versus in operating expenses varies by company and matters enormously for comparing margins across peers: a software firm's version (hosting, support) looks nothing like a manufacturer's.`},
{t:'Operating margin',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Profitability after all core business costs, before interest and taxes`,d:`Operating income divided by revenue — what's left after both direct costs and operating expenses (R&D, sales, G&A), but before interest and taxes. It measures how profitable the core business is, independent of capital structure. Comparing this margin across a peer set is one of the fastest reads on competitive position and cost discipline.`},
{t:'Operating leverage',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`When high fixed costs make profits swing harder than sales`,d:`The degree to which a company's costs are fixed rather than variable. High fixed costs mean each incremental dollar of revenue drops almost entirely to profit — margins expand rapidly as sales grow, and collapse just as fast when sales fall. It's why software companies scale so beautifully and why airlines are brutal in downturns. Buy-side analysts hunt for positive inflections in businesses with heavy fixed-cost bases.`},
{t:'Free cash flow (FCF)',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`What operations generate minus capital spending; what owners could actually pocket`,d:`Operating cash flow minus capital expenditures — the cash a business generates after funding its own maintenance and growth. This is the number that ultimately underpins valuation: dividends, buybacks, debt paydown, and acquisitions are all funded from it. Earnings can be managed; sustained FCF is much harder to fake, which is why investors treat the conversion of earnings into it as a core quality test.`},
{t:'Working capital',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Current assets minus current liabilities; the cash tied up in operating`,d:`Current assets minus current liabilities — the money tied up in running the business day to day (inventory, receivables) net of what's owed short-term (payables). Growth usually consumes it: more sales mean more inventory and receivables before the cash comes in. Businesses with negative working capital — collecting from customers before paying suppliers, like Amazon or insurers — effectively get financed by their own operations.`},
{t:'Depreciation & amortization (D&A)',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Non-cash charges spreading an asset's cost over its useful life`,d:`Non-cash expenses spreading the cost of assets over their useful lives — depreciation for physical assets, amortization for intangibles. Because no cash leaves when the charge is booked, it's added back in EBITDA and cash flow. But treating it as fake cost is a classic error: the assets really do wear out, and the capex to replace them is very real. Buffett's critique of EBITDA rests on exactly this point.`},
{t:'CapEx vs. OpEx',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Spending capitalized onto the balance sheet versus expensed immediately`,d:`Capital expenditures buy long-lived assets and land on the balance sheet, hitting earnings gradually through depreciation; operating expenses hit the income statement immediately. The classification changes reported profitability without changing economics — capitalizing costs flatters current earnings. Watch for companies shifting spend between the two, and distinguish maintenance capex (keeping the lights on) from growth capex (expanding) when judging true free cash flow.`},
{t:'Goodwill',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`The premium over fair value of net assets paid in an acquisition`,d:`The accounting plug created when an acquirer pays more than the fair value of the target's identifiable net assets — the premium for brand, synergies, or overpayment. It sits on the balance sheet and isn't amortized, but is tested annually for impairment. A balance sheet heavy with it tells you the company grew by acquisition, and a subsequent write-down is management admitting it overpaid.`},
{t:'Impairment',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`A write-down admitting an asset is worth less than its book value`,d:`A write-down recorded when an asset's carrying value exceeds what it can actually recover — most famously goodwill impairments after bad acquisitions. It's a non-cash charge, but far from meaningless: it's a formal confession that past capital allocation destroyed value. The cash was lost when the deal closed; the impairment is when accounting catches up to reality.`},
{t:'Deferred revenue',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Cash collected for services not yet delivered; a liability, not income`,d:`Cash collected from customers before the service is delivered — a liability, because the company still owes the work. Common in subscription and SaaS businesses where customers pay annually upfront. Counterintuitively, it's usually a bullish signal: growing deferred revenue means bookings are running ahead of recognized revenue, and the company gets to use interest-free customer money in the meantime.`},
{t:'GAAP vs. non-GAAP',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Official accounting standards versus management's adjusted presentation of results`,d:`GAAP is the official rulebook; non-GAAP is management's adjusted version, stripping out items they deem non-recurring or non-cash — stock-based compensation, restructuring, amortization of acquired intangibles. Sometimes the adjustments genuinely clarify; often they systematically flatter. The size and persistence of the gap between the two is itself a signal: "one-time" charges that recur every year aren't one-time.`},
{t:'Earnings quality',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`How faithfully reported profits reflect durable, cash-backed economics`,d:`The degree to which reported earnings reflect durable, cash-generating economic reality rather than accounting choices. High quality: earnings convert to cash, accruals are small, results don't rely on one-offs or aggressive estimates. Low quality: net income persistently outruns cash flow, receivables grow faster than sales, reserves get released to hit numbers. Short sellers build entire strategies on detecting the low end.`},
{t:'FIFO vs. LIFO',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Two inventory costing conventions that shift profits when prices move`,d:`Two conventions for costing inventory: first-in-first-out assumes the oldest units are sold first; last-in-first-out assumes the newest. In inflationary periods LIFO books higher costs, so it reports lower profits and lower taxes but leaves the balance sheet carrying stale inventory values. The choice changes reported margins without changing the business — a clean example of why analysts adjust before comparing companies.`},
{t:'Net debt',c:'Finance',g:'Accounting & Business Quality',sg:'Accounting & Financial Statements',q:`Total borrowings minus cash; the balance-sheet figure bridging EV and equity value`,d:`Total debt minus cash and equivalents — the company's true net borrowing position. It's the bridge between enterprise value and equity value (EV = market cap + net debt), and the numerator in leverage ratios. A company with $5B of debt and $6B of cash is, in the way that matters, unlevered.`},

/* ---------- Valuation (additions) ---------- */
{t:'Intrinsic value',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`What an asset is truly worth based on its future cash generation`,d:`What an asset is actually worth based on the cash it will generate over its life, discounted to today — as distinct from its price, which is just what someone last paid. The entire discipline of value investing rests on this gap: price is what you pay, value is what you get. It can only ever be estimated, which is why serious investors think in ranges and demand a margin of safety.`},
{t:'Margin of safety',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Buying well below estimated worth so errors don't destroy you`,d:`Buying at a significant discount to your estimate of intrinsic value, so that even if your analysis is partly wrong, you're protected. Graham's foundational concept — the recognition that valuation is imprecise and the future uncertain, so the discount itself is the risk management. The deeper insight: it converts humility about your own fallibility into a structural advantage.`},
{t:'P/E ratio',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Price per share divided by earnings per share`,d:`Price per share divided by earnings per share — the most quoted multiple in markets. It compresses an enormous amount into one number: growth expectations, perceived quality, interest rates, and sentiment. A high one isn't "expensive" and a low one isn't "cheap" in isolation; the question is always whether the embedded expectations are right. Forward versions use estimated earnings; trailing use the last twelve months.`},
{t:'Earnings yield',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Profits divided by price; the inverse of the most famous multiple`,d:`Earnings per share divided by price — the P/E flipped upside down, expressed as a percentage. Its power is comparability: a stock earning 5% on its price can be weighed directly against a bond yielding 4.5%. This framing (the "Fed model" logic) is how professionals think about equities versus fixed income competing for the same capital.`},
{t:'PEG ratio',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`A multiple divided by growth rate to normalize across growth profiles`,d:`The P/E ratio divided by the earnings growth rate — an attempt to normalize valuation across companies growing at different speeds, popularized by Peter Lynch. A ratio under 1 traditionally signaled growth going cheap. Crude (it treats growth as linear and ignores quality and durability), but useful as a first filter for whether a high multiple is earned or just expensive.`},
{t:'P/B (Price-to-Book)',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Market value compared against balance-sheet net asset value`,d:`Market capitalization divided by book value (accounting net worth). The classic value metric for asset-heavy businesses — banks especially, where the balance sheet is the business. Increasingly misleading for modern companies whose real assets (brands, software, network effects) never appear on the balance sheet, which is a core reason traditional value screens have struggled in the intangibles era.`},
{t:'Levered vs. unlevered FCF',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Cash flow to all capital providers versus to equity holders only`,d:`Unlevered free cash flow is what the business generates before any debt payments — available to all capital providers, discounted at WACC to get enterprise value. Levered FCF is what remains for equity holders after interest and debt service, discounted at the cost of equity. Mixing the two — pairing the wrong cash flow with the wrong discount rate — is among the most common technical errors in DCF work.`},
{t:'Discount rate',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`What converts future cash flows into present value, reflecting time and risk`,d:`The rate used to translate future cash flows into today's dollars, reflecting both time value and risk. It's the gravitational constant of valuation: small changes move fair values enormously, especially for long-duration assets whose cash flows sit far in the future. This is the mechanical reason high-growth stocks are so rate-sensitive — when rates rose in 2022, the present value of distant profits collapsed.`},
{t:'Sum-of-the-parts (SOTP)',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Valuing each business segment separately, then adding them up`,d:`Valuing a multi-segment company by valuing each business separately with the multiple appropriate to it, then summing — often revealing that the conglomerate trades below the sum of its pieces. That gap ("conglomerate discount") is the analytical foundation for activist campaigns and spin-offs: if the parts are worth more separated, someone will eventually try to separate them.`},
{t:'Dividend discount model (DDM)',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`Valuing a stock as the present value of its future payouts`,d:`Valuing a stock as the present value of all its future dividends — the oldest formal equity valuation framework. The Gordon growth version reduces to price = next dividend ÷ (discount rate − growth). Rarely used literally today outside banks and utilities, but conceptually foundational: it makes explicit that a stock's value must ultimately trace to cash returned to owners.`},
{t:'Replacement cost',c:'Finance',g:'Valuation & Deals',sg:'Valuation',q:`What it would take to rebuild a business's assets from scratch today`,d:`What it would cost to recreate a company's productive assets from scratch today. When market value sits far below it, buying companies is cheaper than building (a signal for M&A and a floor for valuation); far above it invites new competition to enter. Tobin's Q formalizes the ratio. Especially relevant for commodity, industrial, and infrastructure businesses where the assets are tangible.`},

/* ---------- Fixed Income & Rates ---------- */
{t:'Coupon',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The fixed periodic interest payment a bond promises`,d:`The fixed interest payment a bond makes, set at issuance as a percentage of face value — a 5% version on a $1,000 bond pays $50 a year. The name survives from the era when bondholders literally clipped paper coupons to claim payment. Distinct from yield: the payment is fixed forever, while yield moves constantly with the bond's price.`},
{t:'Par value',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The face amount repaid at a bond's maturity`,d:`The face amount the issuer repays at maturity, typically $1,000 per bond. Prices are quoted relative to it: trading above is "at a premium," below is "at a discount." A bond drifting far below face value is the market repricing default risk — distressed investors talk in "cents on the dollar" for exactly this reason.`},
{t:'Yield to maturity (YTM)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The total annualized return from holding a bond to the end`,d:`The total annualized return an investor earns buying a bond at today's price and holding to maturity, counting coupons and the pull to par. It's the bond market's universal price language — traders quote it, not dollar prices, because it makes bonds of different coupons and maturities directly comparable. Mechanically, it's the IRR of the bond's cash flows.`},
{t:'Convexity',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The curvature in how bond prices respond to rate moves`,d:`The second-order effect in bond math: duration says how much price moves per unit of yield change, and this measures how that sensitivity itself changes. Positive versions (most bonds) are favorable — prices rise more when rates fall than they drop when rates rise. Mortgage-backed securities famously carry the negative kind, because homeowners refinance exactly when it hurts the bondholder most.`},
{t:'Investment grade vs. high yield',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The rating line at BBB- dividing the bond market in two`,d:`The dividing line of the credit market: BBB-/Baa3 and above is investment grade; below is high yield ("junk"). The line matters structurally, not just descriptively — many institutions are prohibited from holding below it, so a downgrade across the boundary ("fallen angel") triggers forced selling regardless of fundamentals. That forced selling is itself a hunting ground for distressed and event-driven funds.`},
{t:'Treasuries (bills, notes & bonds)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`U.S. government debt across maturities; the market's risk-free benchmark`,d:`U.S. government debt: bills mature inside a year, notes in 2–10 years, bonds in 20–30. Backed by the full faith and credit of the U.S., they define the "risk-free rate" from which every other asset is priced — every credit spread, equity risk premium, and discount rate is built on top of this curve. The deepest, most liquid securities market in the world.`},
{t:'TIPS',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Government bonds whose principal adjusts with the CPI`,d:`Treasury Inflation-Protected Securities — government bonds whose principal adjusts with CPI, so coupons and repayment rise with inflation. Their real function for analysts: the gap between nominal Treasury yields and their yields ("breakeven inflation") is the market's live, tradable forecast of future inflation — often more informative than any economist's estimate.`},
{t:'Fed funds rate',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The overnight interbank benchmark the central bank targets`,d:`The overnight rate at which banks lend reserves to each other, and the primary policy instrument the Federal Reserve targets. Every other rate in the economy — mortgages, corporate borrowing, money market yields — is priced off expectations for its path. When people say "the Fed hiked," this is what moved. Fed funds futures let you read the market's implied odds for upcoming meetings.`},
{t:'SOFR',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The overnight benchmark that replaced LIBOR after its manipulation scandal`,d:`The Secured Overnight Financing Rate — the benchmark that replaced LIBOR after the manipulation scandals. Based on actual overnight repo transactions secured by Treasuries, rather than banks' self-reported estimates. Trillions in floating-rate loans, derivatives, and private credit deals now reset off it; "S+450" in a term sheet means 450 basis points over this rate.`},
{t:'Term premium',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Extra yield demanded for locking money up in longer maturities`,d:`The extra yield investors demand for holding long-maturity bonds instead of rolling short-term ones — compensation for inflation uncertainty, rate volatility, and supply risk over the horizon. Long yields decompose into expected short rates plus this premium; when long rates rise while Fed expectations are flat, this component is what's moving. Deficit and Treasury-supply debates are largely debates about it.`},
{t:'Reinvestment risk',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`The danger that maturing cash must be redeployed at lower rates`,d:`The risk that cash flows — coupons or maturing principal — must be reinvested at lower rates than the original investment earned. It's the mirror image of price risk: falling rates lift bond prices but hurt reinvestment. Investors sitting in T-bills at 5% face it acutely when the Fed cuts, which is exactly when duration (locking in long rates) proves its worth.`},
{t:'Callable bond',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Debt the issuer can repay early when refinancing gets attractive`,d:`A bond the issuer can redeem before maturity at a set price — an embedded option held by the issuer, exercised precisely when it hurts the investor (rates fell, and they refinance cheap). Investors are paid for granting this via higher yield. Most high yield bonds are callable, which caps their price upside and shapes the entire return profile of the asset class.`},
{t:'Leveraged loan',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Floating-rate, senior secured lending to heavily indebted companies`,d:`A senior secured, floating-rate loan to a below-investment-grade company — the workhorse financing of private equity buyouts. Floating rates (SOFR plus a spread) mean the interest burden rises with Fed hikes, transferring rate risk from lender to borrower. Mostly bought by CLOs. The "cov-lite" trend — loans stripped of traditional protective covenants — became one of the defining credit-cycle debates of the era.`},
{t:'CLO (Collateralized Loan Obligation)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`A securitization slicing a loan portfolio into rated tranches`,d:`A vehicle that buys a diversified portfolio of leveraged loans and finances it by issuing tranches of varying seniority — AAA at the top taking losses last, equity at the bottom absorbing them first. The largest buyer base for leveraged loans, making this machinery central to how buyouts get funded. Structurally a cousin of the pre-2008 CDO, though built on loans and with more conservative structures.`},
{t:'Securitization',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Pooling cash-flowing assets and selling claims on them as bonds`,d:`Pooling cash-flowing assets — mortgages, auto loans, credit card receivables — and selling bonds backed by the pool, sliced into tranches by risk appetite. It transforms illiquid loans into tradable securities and moves risk off bank balance sheets to capital markets. The machinery that enabled both the modern mortgage market and, when the underlying collateral rotted, the 2008 crisis.`},
{t:'Repo market',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Fixed Income & Rates',q:`Overnight secured lending against Treasury collateral; the system's plumbing`,d:`The market for repurchase agreements — overnight loans secured by Treasury collateral, where one party sells securities and agrees to buy them back tomorrow at a slightly higher price. It's the plumbing of the financial system: how dealers finance inventories and hedge funds lever positions, trillions rolling nightly. When it seizes (September 2019, March 2020), the Fed intervenes within days, because everything else sits on top of it.`},

/* ---------- Derivatives & Hedging ---------- */
{t:'Derivative',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`A contract whose value comes from some other underlying asset`,d:`A contract whose value derives from something else — a stock, bond, rate, currency, or index — rather than being an asset itself. The family includes forwards, futures, options, and swaps. Two honest uses, one instrument: transferring risk to whoever can bear it best (hedging), or expressing views with leverage and precision (speculation). Notional amounts outstanding dwarf global GDP, which says less about risk than about how thoroughly modern finance runs on them.`},
{t:'Forward contract',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`A private, customized agreement to trade at a set future price`,d:`A private, customized agreement between two parties to buy or sell an asset at a set price on a future date. Traded over-the-counter, tailored to any size or terms, settled at maturity — which means each side bears the other's credit risk for the life of the contract. The building block from which the exchange-traded, standardized version was later engineered.`},
{t:'Futures contract',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`Exchange-traded, standardized, daily-settled commitment to buy or sell later`,d:`A standardized agreement to buy or sell an asset at a set price on a future date, traded on an exchange with a clearinghouse guaranteeing both sides. Positions are marked to market daily, with gains and losses settled in cash each night through margin accounts — the mechanism that nearly eliminates counterparty risk. The instrument of choice for macro funds and CTAs expressing views on rates, commodities, and indices.`},
{t:'Call option',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The right, not obligation, to buy at a set price`,d:`The right — but not the obligation — to buy an asset at a set strike price before expiration. Buyers pay a premium for asymmetric exposure: losses capped at the premium, upside theoretically unlimited. That convexity is why they're the vehicle for leveraged bullish bets, and why sellers (who collect small premiums against large potential losses) are effectively in the insurance business.`},
{t:'Put option',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The right, not obligation, to sell at a set price`,d:`The right — but not the obligation — to sell an asset at a set strike price before expiration. It functions as insurance on a position: worth little in calm markets, enormously valuable in crashes. Portfolio managers buy them for tail protection; the persistent premium paid for that protection (the volatility risk premium) is itself a harvested source of return for those willing to sell it.`},
{t:'Strike price',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The preset level at which an option can be exercised`,d:`The preset price at which an option can be exercised. Its relationship to the current market price defines everything: in-the-money (exercising is profitable), at-the-money, or out-of-the-money. Deep out-of-the-money options are cheap lottery tickets; the strike you choose is the purest expression of how far and how fast you think the underlying will move.`},
{t:'Option premium',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The upfront price paid for an asymmetric payoff; decays with time`,d:`The price paid upfront to own an option — composed of intrinsic value (any immediate exercise profit) plus time value (the worth of remaining optionality). Time value decays toward zero at expiration, bleeding fastest in the final weeks. The core tension of options: buyers need the underlying to move enough to overcome this decay; sellers earn it by absorbing the risk that it does.`},
{t:'Implied volatility',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The future turbulence embedded in option prices; fear made numeric`,d:`The level of future volatility embedded in an option's market price — extracted by running the pricing model backwards. It's the market's live estimate of how turbulent things will be, which is why the VIX (implied volatility on S&P 500 options) is called the fear gauge. When it's cheap relative to what materializes, option buyers win; overpriced, sellers collect. Entire volatility funds trade nothing but that gap.`},
{t:'The Greeks (delta, gamma, theta, vega)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The sensitivities describing how option values respond to market changes`,d:`The sensitivities of an option's price: delta (per $1 move in the underlying, and a proxy for probability of finishing in-the-money), gamma (how fast delta itself changes), theta (daily time decay), and vega (sensitivity to implied volatility). Professionals don't think in option prices — they think in these exposures, hedging the ones they don't want and keeping the ones that express their view.`},
{t:'Swap',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`An agreement to exchange one stream of cash flows for another`,d:`An agreement to exchange cash flow streams — most commonly fixed-rate payments for floating-rate ones (an interest rate version). The largest derivatives market by notional size, and the invisible plumbing of corporate finance: a company that issued fixed-rate bonds but wants floating exposure simply layers one on. Also the mechanism through which hedge funds take massive rate positions without owning a single bond.`},
{t:'Credit default swap (CDS)',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`Insurance-like protection that pays out if a borrower fails to pay`,d:`A contract paying out if a specified borrower defaults — economically, insurance on debt. The buyer pays a running premium (quoted in basis points, and itself a cleaner read on credit risk than bond spreads); the seller compensates them if default occurs. Crucially, you don't need to own the debt to buy protection, which enables both elegant hedges and the pure short-credit bets made famous in 2008.`},
{t:'Hedging',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`Taking an offsetting position to neutralize an unwanted exposure`,d:`Taking an offsetting position to reduce an unwanted exposure — shorting index futures against a stock portfolio, buying puts against a concentrated position, swapping floating-rate debt to fixed. The discipline is knowing what you're paying: every hedge costs something in premium, carry, or forgone upside. The professional question is never "should we hedge everything" but "which risks are we paid to hold, and which should we pay to shed."`},
{t:'Notional value',c:'Finance',g:'Fixed Income, Credit & Derivatives',sg:'Derivatives & Hedging',q:`The face amount a derivative references, not the money at risk`,d:`The face amount a derivative contract references — the base on which payments are calculated, not the money actually changing hands or at risk. A $100M interest rate swap might involve annual payments of $1M and risk far less. Headlines about "quadrillions in derivatives" almost always confuse this figure with exposure, one of the most common category errors in financial commentary.`},

/* ---------- Portfolio Construction & Risk ---------- */
{t:'Diversification',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Spreading exposure so no single position can sink the portfolio`,d:`Spreading capital across assets whose risks don't move together, so no single failure is fatal. Markowitz called it the only free lunch in finance: combining imperfectly correlated assets reduces portfolio risk more than it reduces expected return. The catch professionals obsess over: correlations converge toward 1 in crises — the protection is weakest exactly when you need it most.`},
{t:'Correlation',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`How closely two assets move together, from -1 to +1`,d:`A measure from -1 to +1 of how two assets move together. It's the mathematical engine of diversification — portfolio risk depends less on individual volatilities than on how holdings co-move. Critically, it's unstable: stock-bond correlation flipped positive in 2022, breaking the 60/40 portfolio's core assumption, a reminder that historical correlation is a description, not a promise.`},
{t:'Systematic vs. idiosyncratic risk',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Market-wide exposure you can't diversify away versus company-specific exposure you can`,d:`Systematic risk is market-wide — recessions, rate shocks, wars — and cannot be diversified away; idiosyncratic risk is specific to one company and can be. Theory says only the first earns a risk premium, since the second is eliminable for free. The distinction drives fund design: long/short equity is the deliberate attempt to strip out the market and be paid purely for stock-specific insight.`},
{t:'Volatility',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`The standard deviation of returns; finance's default proxy for risk`,d:`The standard deviation of returns — how widely an asset swings around its average. Finance's default risk proxy because it's measurable, but the equation of volatility with risk is contested: value investors argue true risk is permanent capital loss, and a volatile asset bought cheap may be safer than a stable one bought dear. Still the language of Sharpe ratios, options pricing, and risk models.`},
{t:'Value at Risk (VaR)',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`A statistical estimate of worst-case loss at a confidence level`,d:`A statistical estimate of maximum loss over a horizon at a given confidence — "one-day 95% VaR of $10M" means losses should exceed $10M only 5% of days. The standard risk-desk and regulatory metric, and famously dangerous when misread: it says nothing about how bad the tail beyond the threshold gets. Institutions have repeatedly blown up inside the 5% the model politely declined to describe.`},
{t:'Drawdown',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`The peak-to-trough decline; the risk measure investors actually feel`,d:`The decline from a portfolio's peak to its subsequent trough — the risk investors actually experience, as opposed to abstract volatility. Maximum drawdown is a core due diligence statistic for allocators because recovery math is brutal: a 50% loss requires a 100% gain to break even. Deep drawdowns also trigger redemptions, forcing selling at the bottom — turning a market decline into a permanent one.`},
{t:'Sortino ratio',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Return per unit of downside deviation only, ignoring upside swings`,d:`A refinement of the Sharpe ratio that penalizes only downside volatility, on the logic that upside swings are not what investors fear. Excess return divided by downside deviation. Especially relevant for asymmetric strategies — a fund with many small gains and rare large ones gets unfairly punished by Sharpe but shows honestly here. As always, know which ratio a manager chooses to market, and why.`},
{t:'Information ratio',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Active return over a benchmark divided by tracking error`,d:`Active return over a benchmark divided by tracking error — the consistency of a manager's outperformance per unit of active risk taken. The institutional allocator's core skill metric: an IR of 0.5 sustained over years is genuinely strong. It reframes the question from "did you beat the benchmark" to "how reliably, and how much risk did you take to do it."`},
{t:'Tracking error',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`How much a portfolio's returns deviate from its benchmark`,d:`The volatility of the difference between a portfolio's returns and its benchmark's. Low means the fund hugs the index; high means real active bets. It quantifies career risk as much as investment risk — a manager can be right eventually but fired first if deviation runs too hot. "Closet indexers" charge active fees while keeping this number near zero, the quiet scandal of the mutual fund industry.`},
{t:'Efficient frontier',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`The curve of portfolios offering maximum return per unit of risk`,d:`The curve of portfolios offering the highest expected return for each level of risk — the centerpiece of Markowitz's modern portfolio theory. Anything below it is strictly dominated. Elegant in theory, treacherous in practice: the optimization is hypersensitive to input estimates, and garbage expected returns in means garbage allocations out. Its real legacy is the discipline of thinking in portfolios rather than positions.`},
{t:'Rebalancing',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Trimming winners and adding to laggards to restore target weights`,d:`Periodically restoring a portfolio to its target weights — mechanically selling what has run and buying what has lagged. It's systematized contrarianism: a discipline that forces selling high and buying low without requiring a view. The deeper function is behavioral, converting the hardest emotional decisions in investing into a calendar routine executed without deliberation.`},
{t:'Risk parity',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Allocating by volatility contribution rather than dollars, often levering bonds`,d:`Allocating capital so each asset class contributes equally to portfolio risk rather than equal dollars — which means leveraging low-volatility assets like bonds to match equities' risk contribution. Pioneered by Bridgewater's All Weather fund. Its stress test arrived in 2022: when stocks and bonds fell together, levered bond exposure amplified rather than cushioned, exposing the regime assumption underneath.`},
{t:'Tail risk',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`Low-probability, catastrophic outcomes lurking beyond normal distributions`,d:`The risk of rare, extreme events sitting in the far tails of the return distribution — crashes, defaults, crises that "shouldn't" happen under normal-distribution assumptions but do, repeatedly. Taleb's black swans. Markets systematically underprice it in calm periods because sellers of insurance collect steady premiums until the event. The professional question: are you being paid to hold it, or paying to shed it?`},
{t:'Basis points (bps)',c:'Finance',g:'Portfolio, Risk & Performance',sg:'Portfolio Construction & Risk',q:`One hundredth of a percent; the industry's unit of precision`,d:`One hundredth of a percentage point — 50 of them equal 0.50%. The universal unit of professional finance for rates, spreads, fees, and performance, existing because the difference between "7%" and "7.5%" is enormous when billions compound on it. Fluency here is table stakes: nobody on a desk says "half a percent."`},

/* ---------- Deals & Corporate Finance ---------- */
{t:'LBO (Leveraged Buyout)',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Acquiring a company mostly with borrowed money secured by its own cash flows`,d:`Acquiring a company using mostly debt — often 60-70% of the price — secured by the target's own assets and repaid from its own cash flows. The defining private equity transaction. The math: equity returns get amplified because debt paydown and any value growth accrue to a thin equity slice. The risk: leverage amplifies both directions, and an over-levered company hits distress in the first downturn.`},
{t:'Synergies',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The claimed value from combining two companies; often overestimated`,d:`The additional value claimed from combining two companies — cost synergies (eliminating duplicate functions, purchasing scale) and revenue synergies (cross-selling, distribution). Cost synergies are real and usually achieved; revenue synergies are notoriously overestimated and underdelivered. Since acquisition premiums are justified by these projections, the skeptical analyst's first question on any deal is whether the claimed number survives contact with reality.`},
{t:'Accretion / dilution',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Whether a deal raises or lowers the acquirer's earnings per share`,d:`Whether an acquisition increases (accretive) or decreases (dilutive) the acquirer's earnings per share — the standard first-pass screen on deal math, driven by relative valuations and financing mix. The sophisticated caveat: EPS accretion is not value creation. Overpaying with cheap debt can be accretive and still destroy value; the analysis tells you about optics, not economics.`},
{t:'Debt/EBITDA (leverage ratio)',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The standard multiple measuring how indebted a company is`,d:`Total (or net) debt divided by EBITDA — the standard shorthand for how levered a company is, expressed in "turns" ("levered 5x"). It's the language of every buyout structure, credit agreement, and covenant package. Rough contours: under 2x conservative, 4-6x typical LBO territory, above that aggressive. The flaw is inherited from EBITDA itself: it ignores capex, so capital-intensive businesses look healthier than they are.`},
{t:'Interest coverage',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Operating earnings relative to the debt-service bill; solvency's flow measure`,d:`Operating income (or EBITDA) divided by interest expense — how comfortably earnings cover the debt service. Where Debt/EBITDA is the stock measure of leverage, this is the flow measure of survivability. It's what deteriorates when floating-rate debt reprices upward, and the metric that turned rate hikes into a slow-motion stress test for every over-levered balance sheet built in the cheap-money era.`},
{t:'Term sheet',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The non-binding document laying out a deal's key economics before lawyers draft`,d:`The short, mostly non-binding document laying out a proposed deal's key terms — price, structure, governance, exclusivity — before lawyers draft the full agreements. In venture deals it covers valuation, liquidation preferences, board seats, and anti-dilution. The professional wisdom: the fights that matter happen here; by the time definitive documents circulate, the economics are settled.`},
{t:'Letter of intent (LOI)',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`A preliminary agreement signaling a serious plan to transact`,d:`A preliminary agreement expressing serious intent to transact on outlined terms — the M&A cousin of the term sheet, typically granting the buyer exclusivity for a diligence period. Mostly non-binding on price but binding on process terms like confidentiality. Signing one moves a deal from conversation to process: advisors engage, data rooms open, and walking away starts carrying reputational cost.`},
{t:'Tender offer',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`A public bid to shareholders directly, bypassing the board`,d:`A public offer to buy shares directly from a company's shareholders at a stated price, typically at a premium — bypassing the board entirely. The classic mechanism of hostile acquisitions, governed by SEC rules on timing and disclosure. Merger arbitrageurs live in the space between the offer price and the trading price, handicapping the odds the deal completes.`},
{t:'Hostile takeover',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Acquiring a company over its board's objection`,d:`An acquisition pursued over the objection of the target's board — executed via tender offer directly to shareholders or a proxy fight to replace the directors. Rarer than in the 1980s heyday because defenses (poison pills, staggered boards) improved, but the credible threat of one still disciplines management everywhere. Modern activism is often the same pressure applied with a smaller stake and louder letters.`},
{t:'Poison pill',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`A defense that floods the market with discounted shares if an acquirer crosses a threshold`,d:`A shareholder rights plan that triggers when any acquirer crosses an ownership threshold (often 10-15%), letting all other shareholders buy discounted stock — massively diluting the acquirer and making hostile accumulation economically irrational. Boards adopt one overnight when a raider appears. It doesn't prevent acquisition; it forces negotiation through the board, which is precisely the point (and the governance controversy).`},
{t:'Share buyback',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`A company repurchasing its own stock to return capital`,d:`A company repurchasing its own shares, shrinking the share count so each remaining share owns more of the business. Now the dominant form of returning capital in U.S. markets, prized for tax efficiency and flexibility over dividends. The analytical judgment is entirely price-dependent: repurchases below intrinsic value compound wealth for continuing holders; buybacks at any price to offset stock-comp dilution are just expense laundering.`},
{t:'Capital allocation',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Management's choices for deploying cash flow across competing uses`,d:`The set of decisions about deploying a company's cash: reinvest in the business, acquire, pay dividends, buy back stock, or pay down debt. Over long horizons it rivals operations in determining shareholder outcomes — the same cash flows allocated brilliantly or foolishly produce wildly different endpoints. The great CEOs of Thorndike's "The Outsiders" were, above all, disciplined allocators who treated it as their primary job.`},
{t:'Spin-off',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Separating a division into an independent public company`,d:`Separating a division into an independent public company, with shares distributed to existing holders. The logic is usually focus and the sum-of-the-parts gap — conglomerates trade at discounts that separation can close. A classic special-situations hunting ground: spun entities are often indiscriminately sold by index funds and holders who never wanted them, creating temporary mispricing that Greenblatt made famous.`},
{t:'Earnout',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Deferred acquisition payments contingent on hitting future targets`,d:`A deal structure where part of the purchase price is contingent on the target hitting future milestones — revenue, EBITDA, product launches. It bridges valuation gaps between optimistic sellers and skeptical buyers by making the seller prove their own projections. Notoriously litigious in practice: post-close, the buyer controls the business and thus the levers that determine whether targets are hit.`},
{t:'Due diligence — the deal process',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`The structured investigation before capital commits: commercial, financial, legal`,d:`The structured investigation a buyer runs before committing capital: commercial (market and competitive position), financial (quality of earnings, working capital), legal, tax, and operational workstreams, often with specialist advisors on each. In PE, the quality-of-earnings report — scrubbing reported EBITDA for adjustments — is the spine. The output isn't just "yes or no" but price, structure, and the list of what must be fixed post-close.`},
{t:'Take-private',c:'Finance',g:'Valuation & Deals',sg:'Deals & Corporate Finance',q:`Buying out all public shareholders and delisting the company`,d:`Acquiring all of a public company's shares and delisting it — usually a private equity sponsor, financed as an LBO. The pitch: escape quarterly-earnings pressure, restructure away from public scrutiny, and re-lever the balance sheet. Requires board approval and a shareholder vote, at a premium to market. The wave of them tends to crest when public valuations sag below what sponsors will pay.`},

/* ---------- Market Structure & Trading ---------- */
{t:'Bid-ask spread',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The gap between the best buying and selling prices; the cost of immediacy`,d:`The gap between the highest price buyers will pay (bid) and the lowest sellers will accept (ask). It's the price of immediacy — cross it and you've paid the market maker for instant execution. Tight spreads signal deep liquidity (large-cap stocks trade at pennies); wide ones signal thin markets where trading itself is expensive. For large funds, this cost compounds into a real drag on returns.`},
{t:'Market maker',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`A firm continuously quoting both sides to provide liquidity`,d:`A firm that continuously quotes both a buy and sell price, profiting from the spread while providing the liquidity everyone else consumes. Modern versions (Citadel Securities, Jane Street, Virtu) are high-frequency technology firms managing inventory risk in microseconds. The controversial economics: retail brokers sell them order flow, which funds "free" trading — you pay in structure what you don't pay in commission.`},
{t:'Limit vs. market order',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Specifying your price versus accepting whatever's immediately available`,d:`The two basic order types: one executes immediately at the best available price (certainty of execution, no control over price); the other executes only at your specified price or better (price control, no guarantee of filling). The professional default is price-controlled, because in thin or fast markets an unrestricted order can fill catastrophically far from the quote you saw.`},
{t:'Order book',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The live ledger of resting bids and offers stacked at each price`,d:`The exchange's live ledger of resting limit orders — every bid and offer stacked by price level. Its depth shows how much can trade before prices move, which is what traders mean by liquidity. Reading it is the microstructure trader's craft, complicated by the games played within it: spoofing (fake orders to mislead) is illegal precisely because the book is information everyone trades on.`},
{t:'Short interest',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Shares borrowed and sold in bets against a stock; squeeze fuel`,d:`The total shares sold short, usually expressed as a percentage of float or as days-to-cover (short interest ÷ average daily volume). It's simultaneously a sentiment gauge and a mechanical risk factor: heavily shorted stocks carry embedded buying pressure, since every short must eventually buy to close. GameStop demonstrated the endgame — short interest above 100% of float meeting coordinated buying.`},
{t:'Dark pool',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Private venues where large orders trade without displaying intentions`,d:`A private trading venue where orders execute without pre-trade display — designed so institutions can move large blocks without telegraphing intentions and moving the price against themselves. Roughly 40% of U.S. equity volume now trades off-exchange. The tradeoff is transparency: prices are discovered on lit exchanges, while much of the volume rides on that discovery from the shadows.`},
{t:'Slippage',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The gap between intended and actual execution price`,d:`The difference between the price you intended to trade at and where you actually filled — caused by market movement, thin books, and your own order's impact. Trivial for retail size, decisive at scale: a strategy that backtests beautifully can be unprofitable live purely because of it. This is why capacity is a real constraint and why execution algorithms slice large orders into small ones over time.`},
{t:'Market capitalization',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Share price times shares outstanding; the equity's total price tag`,d:`Share price times shares outstanding — the total market price of a company's equity. The sorting variable of the equity world: large-cap ($10B+), mid, small, micro, each with different liquidity, coverage, and institutional ownership. Note what it excludes — debt — which is why enterprise value, not this, is the right base for comparing whole businesses.`},
{t:'Index inclusion',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Joining a major benchmark, triggering mechanical buying from passive funds`,d:`A stock's addition to a major index like the S&P 500, which forces every fund tracking that index to buy it mechanically, regardless of price or view. The resulting pop, and the drop on deletion, is pure flows-versus-fundamentals — nothing about the business changed. As passive ownership grows, the committee decisions and rebalancing rules governing indices have quietly become some of the most powerful forces in markets.`},
{t:'Circuit breaker',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Automatic trading halts triggered by extreme price moves`,d:`Automatic trading halts triggered by extreme moves — market-wide halts at 7%, 13%, and 20% declines in the S&P 500, plus single-stock volatility pauses. Born from the 1987 crash, on the theory that forced pauses interrupt panic spirals and let information catch up with prices. March 2020 tripped the market-wide version four times in two weeks, the mechanism's most intense live test.`},
{t:'VWAP',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`The volume-weighted average price; the standard execution benchmark`,d:`Volume-weighted average price — the day's average trading price weighted by how much volume traded at each level. The standard benchmark for execution quality: a trader who bought below it beat the market's average price that day. Also the target of the most common execution algorithm, which slices a large parent order to track the day's volume curve and minimize footprint.`},
{t:'Front-running',c:'Finance',g:'Markets & Trading',sg:'Market Structure & Trading',q:`Trading ahead of known client orders to profit from their impact`,d:`Trading ahead of a known incoming order to profit from the price impact it will cause — illegal when a broker exploits client order information. The gray-zone cousins are where modern controversy lives: high-frequency strategies inferring large orders from market data and racing them, or "pre-hedging" by dealers. Flash Boys made the latency race a public argument about what counts as cheating versus speed.`},

/* ---------- Equity Investing Styles ---------- */
{t:'Bull vs. bear market',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`The conventional labels for sustained rises and 20% declines`,d:`The conventional labels for market regimes: a sustained rise (typically dated from a 20% gain off a low) versus a decline of 20% or more from a peak. The thresholds are arbitrary but the psychology is real — each regime creates its own feedback loops of confidence or fear. The uncomfortable statistic: most of the market's best single days occur inside the bad regime, which is why timing exits is so costly.`},
{t:'Correction vs. crash',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`A routine 10% pullback versus a violent, rapid collapse`,d:`A correction is a 10-20% decline — routine, occurring most years, and historically resolving without recession. A crash is a violent, compressed collapse (1987's -22% day, March 2020). The distinction matters behaviorally: corrections punish those who panic and reward those who add, but the memory of crashes is what makes staying invested through corrections psychologically hard.`},
{t:'Sector rotation',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`Capital shifting between industry groups as the cycle turns`,d:`The movement of capital between sectors as the economic cycle and rate environment shift — into cyclicals and financials when growth accelerates, into staples and utilities when it slows, out of long-duration tech when rates rise. Watching which sectors lead is a real-time read on what the market believes about the macro trajectory, often before economists confirm it.`},
{t:'Value investing',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`Buying below intrinsic worth, betting price eventually meets reality`,d:`Buying securities below your estimate of intrinsic worth and waiting for price to converge with value — the Graham-to-Buffett lineage. Classic versions screen on low multiples; the evolved version pays fair prices for exceptional businesses. Its brutal decade-plus after 2009 (cheap stocks staying cheap while expensive ones compounded) forced the style's deepest question: is the underperformance cyclical, or did intangibles break the old metrics?`},
{t:'Growth investing',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`Paying premium multiples for rapidly expanding businesses, betting on duration`,d:`Paying premium multiples for companies growing revenue and earnings rapidly, betting the growth persists longer than the market has priced. The style's edge is duration: markets systematically underestimate how long truly great businesses can compound. Its vulnerability is rates and disappointment — when discount rates rise or growth merely decelerates, the multiple compresses violently, punishing the last buyer.`},
{t:'Momentum',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`Buying recent winners; the anomaly that offends efficient markets most`,d:`The empirical tendency of recent winners to keep winning over 3-12 month horizons — the most robust and most theoretically embarrassing anomaly in finance, documented across every asset class and century of data. Explanations lean behavioral: investors underreact to news, then herd. Quant funds harvest it systematically; its known failure mode is the violent "momentum crash" at sharp market turning points.`},
{t:'Mean reversion',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`The gravitational pull of extremes back toward long-run averages`,d:`The tendency of extremes — valuations, margins, growth rates, sentiment — to drift back toward long-run averages. It's the statistical backbone of value investing and contrarian strategies, and of Grantham-style bubble analysis. The killer is timing: extremes can extend for years before reverting ("markets can stay irrational longer than you can stay solvent"), so the concept tells you direction, never date.`},
{t:'Consensus estimates & earnings surprise',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`The analyst-average forecast a company beats or misses each quarter`,d:`The averaged forecasts of sell-side analysts for a company's results — the benchmark against which each quarter is judged as a beat or miss. The game-within-the-game: companies guide expectations down to hop over a lowered bar, so the stock's reaction depends less on results than on results versus positioning. What moves stocks is the surprise, and the revision to future estimates it triggers.`},
{t:'Guidance',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`Management's forward forecast; often moves the stock more than results`,d:`Management's public forecast of upcoming results, issued alongside earnings. It frequently matters more than the reported quarter: the past is priced, and the stock trades on the future's trajectory. Cutting it is among the most punished acts in markets; the credibility of a team's history of forecasts (sandbaggers versus overpromisers) becomes an asset or liability of its own.`},
{t:'Earnings call',c:'Finance',g:'Markets & Trading',sg:'Equity Investing Styles',q:`The quarterly management webcast where tone and Q&A move markets`,d:`The quarterly conference call where management presents results and takes analyst questions. The prepared remarks are theater; the Q&A is the substance — evasions, hedged language, and shifts in tone carry information that never appears in the press release. Buy-side analysts read transcripts systematically, and NLP funds now parse word choice at scale for exactly this reason.`},

/* ---------- Private Markets additions ---------- */
{t:'Platform company',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`The initial acquisition serving as the base for a buy-and-build strategy`,d:`The initial, foundational acquisition in a private equity buy-and-build strategy — large enough to carry professional management, systems, and debt capacity that subsequent smaller acquisitions attach to. Sponsors pay premium multiples for a good one, expecting to average down the blended entry multiple through cheaper add-ons. The quality of this first asset largely determines whether the whole construction compounds or collapses.`},
{t:'Bolt-on / add-on acquisition',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`Smaller purchases tucked into an existing portfolio company`,d:`A smaller acquisition made by an existing portfolio company rather than by the fund directly — tucking a competitor, a geography, or a capability into the platform. The economics that make PE math work: small private targets trade at far lower multiples than the platform commands, so every one acquired below the platform's multiple creates instant markup ("multiple arbitrage") before any operational improvement.`},
{t:'Roll-up strategy',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`Consolidating a fragmented industry through serial small acquisitions`,d:`Consolidating a fragmented industry — dental practices, HVAC contractors, veterinary clinics — through serial acquisition, seeking scale economies and the valuation uplift from becoming institutional-grade. The bull case: buy at 5x, trade at 12x. The bear case, proven repeatedly: integration debt accumulates invisibly, organic growth stalls beneath the acquisition treadmill, and the music stops when leverage or deal flow runs out.`},
{t:'Sponsor',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`Industry shorthand for the private equity firm behind a deal`,d:`Industry shorthand for the private equity firm orchestrating a transaction — as in "sponsor-backed deal" or "financial sponsor coverage" at investment banks. The label distinguishes financial buyers (funds acquiring to sell within a hold period) from strategic buyers (corporations acquiring to keep and integrate). Which type is bidding shapes everything: price discipline, financing structure, and what happens to the company after close.`},
{t:'Club deal',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`Multiple buyout firms teaming up on a single large acquisition`,d:`Multiple private equity firms jointly acquiring a single large target — pooling equity checks for deals too big for any one fund. Common in the mega-buyout era (TXU, the largest LBO ever, took three sponsors). The tensions are structural: shared control blurs accountability, and the 2007 vintage's disasters plus antitrust scrutiny over bid coordination cooled the format considerably.`},
{t:'Portfolio company',c:'Finance',g:'Hedge Funds & Private Markets',sg:'Private Markets — PE, VC & Secondaries',q:`A business owned and operated within a fund's holdings`,d:`A company owned by a private equity or venture fund — one line item in the portfolio, but a whole operating business underneath. In PE, sponsors actively drive them: installing management, executing add-ons, restructuring operations toward exit. "PortCo" in industry shorthand. The interests stack up in layers — LPs own the fund, the fund owns the company, and the incentive design connecting those layers is where fund economics live.`},

/* ---------- Macro Indicators & Policy (Economics) ---------- */
{t:'GDP (Gross Domestic Product)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The total value of goods and services an economy produces`,d:`The total market value of goods and services produced within a country — the headline scorecard of economic activity, decomposable into consumption, investment, government spending, and net exports. U.S. consumption alone is roughly two-thirds of it, which is why the American consumer's health is the perpetual macro question. Reported quarterly at an annualized rate, then revised — sometimes dramatically — as better data arrives.`},
{t:'CPI vs. PCE',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The two rival inflation gauges; the Fed targets the second`,d:`The two main U.S. inflation measures. The first tracks a fixed basket of urban consumer purchases and drives headlines, Social Security adjustments, and TIPS. The second covers broader spending, updates weights as behavior shifts, and runs a few tenths cooler — and it is the one the Fed actually targets at 2%. Markets trade the first's monthly release violently; the Fed reads the second.`},
{t:'Core inflation',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Price changes excluding volatile food and energy components`,d:`Inflation stripped of food and energy prices — not because those don't matter to households, but because their volatility obscures the underlying trend that policy can actually influence. Central bankers watch it (and narrower cuts like "supercore" services) to judge whether inflation is embedded in wages and services or just passing through commodities. The politics of excluding groceries from "real" inflation writes itself.`},
{t:'Unemployment rate & nonfarm payrolls',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The monthly labor data release that markets trade most violently`,d:`The twin headline labor statistics, released together on the first Friday of each month: the share of the labor force without work but seeking it, and the count of jobs added or lost. Labor is half the Fed's mandate, so this release repriced markets all through the inflation fight — with the perverse "good news is bad news" dynamic, where strong hiring meant tighter policy and falling asset prices.`},
{t:'FOMC',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The twelve-member committee that sets U.S. interest rate policy`,d:`The Federal Open Market Committee — the twelve members (seven governors plus a rotation of regional Fed presidents) who set the fed funds target and asset-purchase policy across eight scheduled meetings a year. The decision, statement language, projections, and press conference are parsed word by word; entire strategies trade the gap between what was expected and what shifted. "Fedspeak" between meetings steers markets almost as much.`},
{t:'The dot plot',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The chart of individual policymakers' projected rate paths`,d:`The quarterly chart showing each FOMC participant's anonymous projection of where the policy rate should sit over coming years. Markets treat the median as the Fed's implied path and trade the gap between it and futures pricing. The chairman's persistent caveat — projections, not promises — is routinely ignored, making it one of the most over-interpreted documents in finance.`},
{t:'PMI',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Survey-based diffusion index where 50 divides expansion from contraction`,d:`Purchasing Managers' Index — monthly surveys of corporate purchasing managers on orders, production, employment, and prices, compressed into a diffusion index where readings above 50 signal expansion and below signal contraction. Prized for timeliness: it arrives weeks before hard data and turns at inflection points early. The new-orders component is the most leading of all, which is why macro funds watch it obsessively.`},
{t:'Recession',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`A significant, broad, sustained decline in economic activity`,d:`A significant, widespread, sustained decline in economic activity — officially dated in the U.S. by the NBER, usually long after the fact. The two-consecutive-quarters-of-negative-GDP shorthand is popular but not the actual definition, as 2022's negative quarters without a declared one demonstrated. For markets the timing question is everything: equities typically peak before it starts and bottom before it ends.`},
{t:'Soft landing vs. hard landing',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Whether tightening tames inflation without triggering a recession`,d:`The two endings to a tightening cycle: inflation returns to target with growth intact and unemployment barely rising, or the rate hikes break something and recession follows. History leaned heavily toward the second — most hiking cycles ended in downturns — which made the 2022-24 episode's apparent achievement of the first genuinely rare. Every incoming data point during a cycle gets read as evidence for one ending or the other.`},
{t:'Stagflation',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The toxic combination of stagnant growth and persistent inflation`,d:`Stagnant growth, high unemployment, and high inflation simultaneously — the 1970s nightmare that broke the era's Keynesian consensus, which held the combination impossible. It's the central bank's checkmate position: fighting inflation deepens the stagnation, stimulating growth feeds the inflation. Its mere possibility haunted the 2022 debate, and supply shocks (oil then, pandemic and war recently) are the classic trigger.`},
{t:'FX & exchange rates',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The relative price of currencies, driven by rate differentials and flows`,d:`The price of one currency in another — the largest market on earth by volume, trading over $7 trillion daily. The core driver is interest rate differentials: capital flows toward higher yields, bidding up that currency. For multinationals it silently reshapes earnings; for emerging markets with dollar debts, a strong dollar is a tightening they never voted for. Every macro trade has a currency leg, acknowledged or not.`},
{t:'DXY (Dollar Index)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The benchmark measuring the greenback against major peers`,d:`The index tracking the dollar against a basket of major currencies, dominated by the euro at nearly 58% of the weight. The shorthand gauge for dollar strength, which transmits globally: a rising reading tightens conditions for every dollar borrower abroad, pressures commodities priced in dollars, and drags on U.S. multinationals' foreign earnings. "Dollar wrecking ball" episodes are macro regimes unto themselves.`},
{t:'Carry trade',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Borrowing cheap in one currency to earn yield in another`,d:`Borrowing in a low-rate currency to invest in a higher-yielding one, pocketing the differential — for decades, borrowing yen to buy anything. It works until it doesn't: the trade is structurally short volatility, and when the funding currency surges, everyone exits at once. The August 2024 yen unwind, vaporizing positions globally in days, is the textbook case of the strategy's "picking up nickels in front of a steamroller" nature.`},
{t:'Debt-to-GDP & fiscal deficits',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`Government borrowing scaled against the economy's size`,d:`The government's accumulated debt relative to the economy's annual output, fed by yearly deficits (spending minus revenue). U.S. debt has passed 120% of GDP with structural deficits around 6% in expansion — historically wartime numbers. The live market question is whether Treasury supply eventually demands a higher term premium, making bond markets the disciplinarian ("bond vigilantes") that politics won't be.`},
{t:'Liquidity (macro sense)',c:'Economics',g:'Macro, Rates & Policy',sg:'Macro Indicators & Policy',q:`The aggregate ease of money and credit flowing through the system`,d:`In the macro sense: the overall availability of money and credit in the financial system — shaped by central bank balance sheets, bank lending, and money market conditions. Distinct from the trading sense (ease of executing without moving price), though they interact. The crude but durable observation: when it's abundant, risk assets rise almost regardless of fundamentals; when it drains, correlations converge and everything gets sold.`},

/* ---------- Economic Principles ---------- */
{t:'Supply and demand',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`The two curves whose intersection sets price and quantity`,d:`The foundational model: buyers' willingness to purchase at each price meets sellers' willingness to produce, and the intersection sets market price and quantity. Shortages and surpluses are just prices held away from equilibrium. Deceptively simple, endlessly applicable — the analytical reflex worth building is asking, for any price move, which curve shifted and why, before reaching for narratives.`},
{t:'Elasticity',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`How much quantity responds when price changes`,d:`How responsive quantity is to a change in price. Inelastic goods (insulin, gasoline short-term) see demand barely budge when prices jump; elastic ones (a particular restaurant) see it collapse. For investors this is pricing power quantified: a business facing inelastic demand can push through price increases without losing volume — the single trait Buffett calls the most important in evaluating a business.`},
{t:'Opportunity cost',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`The value of the best alternative you gave up`,d:`The value of the best alternative forgone — the true cost of any choice, which is never just the money spent but what that money and time could have earned elsewhere. In investing it's operationalized as the hurdle rate: every position must beat what the capital could earn in its next-best use, which is why "it went up" isn't success if the index went up more.`},
{t:'Marginal analysis',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Deciding based on the next unit's cost and benefit, not averages`,d:`Reasoning from the next unit rather than the average: what does one more unit of production, investment, or effort cost, and what does it return? Rational decisions happen where marginal benefit meets marginal cost, and sunk history is irrelevant. It's also the key to understanding industries — commodity prices are set by the marginal (highest-cost surviving) producer, and software's near-zero marginal cost explains its economics entirely.`},
{t:'Comparative advantage',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Specializing where your relative efficiency is greatest, even if outmatched everywhere`,d:`Ricardo's insight that trade benefits both parties even when one is better at everything — each should specialize where its relative efficiency is greatest. It's the intellectual foundation of the case for free trade, and the reason economists near-unanimously oppose broad tariffs. The concept scales down personally: the question is never "what am I good at" but "where is my edge largest relative to my alternatives."`},
{t:'Moral hazard',c:'Economics',g:'Economic Principles & Behavior',sg:'Economic Principles',q:`Protection from consequences breeding riskier behavior`,d:`The tendency to take more risk when insulated from the consequences — insured drivers driving worse, bailed-out banks re-levering. It's the central dilemma of every financial rescue: saving the system today teaches it that recklessness gets rescued, seeding the next crisis. "Too big to fail," deposit insurance design, and the Fed put are all standing arguments about how much of it society will tolerate.`},
